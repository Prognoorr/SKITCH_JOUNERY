function PageErrorFallback(err){
  // Renders in place of a page that threw while building. Previously, any
  // uncaught exception inside a page component (PageFn()) propagated all
  // the way out of render() — and since render() had already cleared
  // #app's content (root.innerHTML="") a few lines above before calling
  // PageFn(), the exception aborted everything after that point too,
  // including the sidebar/nav. The user was left staring at a literally
  // empty, black app shell with no way to even navigate away — exactly
  // the "black screen" symptom. This card contains the failure to just
  // this one page and gives the user a way out.
  return h("div",{className:"glass",style:{padding:"28px",textAlign:"center",maxWidth:"440px",margin:"40px auto"}},
    h("div",{style:{fontSize:"36px",marginBottom:"10px"}},"⚠️"),
    h("div",{style:{fontWeight:700,fontSize:"15px",marginBottom:"8px"}},
      _lang==='ar'?'صار خطأ بهاي الصفحة':_lang==='tr'?'Bu sayfada bir hata oluştu':'Something went wrong on this page'
    ),
    h("div",{style:{fontSize:"12px",color:"var(--muted)",marginBottom:"18px",lineHeight:1.6}},
      _lang==='ar'?'التطبيق ما راح يعلق — جربي صفحة ثانية أو أعيدي تحميل التطبيق.':_lang==='tr'?'Uygulama takılmayacak — başka bir sayfa deneyin veya uygulamayı yeniden yükleyin.':'The app won\'t freeze — try another page or reload.'
    ),
    h("div",{style:{display:"flex",gap:"10px",justifyContent:"center"}},
      h("button",{className:"btn btn-p",style:{padding:"9px 16px",fontSize:"12px"},onclick:()=>{S.go("dashboard");}},_lang==='ar'?'الرئيسية':_lang==='tr'?'Ana sayfa':'Dashboard'),
      h("button",{className:"btn btn-g",style:{padding:"9px 16px",fontSize:"12px"},onclick:()=>location.reload()},_lang==='ar'?'إعادة تحميل':_lang==='tr'?'Yeniden yükle':'Reload')
    )
  );
}
function render(){
  cleanupListeners();
  const root=document.getElementById("app");root.innerHTML="";
  document.body.className=S.isDark?"":"light";
  // Clear any old bottom ad banner so we don't stack duplicates
  const oldAd = document.getElementById('_bottomAdBanner');
  if(oldAd) oldAd.remove();
  if(S.booting){
    root.appendChild(BootSplash());
    return;
  }
  if(S.page==="auth"||!S.user){
    root.appendChild(AuthPage());
    if(S.modal?.type==="resetPassword")root.appendChild(ResetPasswordModal());
    if(S.toast)root.appendChild(ToastEl(S.toast.msg,S.toast.body,S.toast.action));
    // Same fix as below: don't let the cookie banner overlap an open modal.
    if(!S.modal){
      const authCookieBanner = CookieConsentBanner();
      if(authCookieBanner) root.appendChild(authCookieBanner);
    }
    return;
  }
  // Make space for the bottom ad banner by adding padding to the root container
  root.style.paddingBottom = '60px';
  const overlay=S.sidebarOpen?h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:150,backdropFilter:"blur(2px)"},onclick:()=>{S.sidebarOpen=false;S.emit();}}):null;
  const pageMap={dashboard:DashboardPage,gallery:GalleryPage,timeline:TimelinePage,add:NewEntryPage,ai:AIPage,lessons:LessonsPage,inspiration:InspirationPage,achievements:AchievementsPage,analytics:AnalyticsPage,community:CommunityPage,notifications:NotificationsPage,profile:ProfilePage};

    h("button",{style:{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"9px",width:"38px",height:"38px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",cursor:"pointer",color:"var(--text)"},onclick:()=>{S.sidebarOpen=!S.sidebarOpen;S.emit();}},S.sidebarOpen?"✕":"☰"),
    h("span",{className:"grad",style:{fontFamily:"Fraunces,serif",fontSize:"16px",fontWeight:700}},S.lang==="ar"?"رحلة الرسم":S.lang==="tr"?"Çizim Yolculuğu":"Sketch Journey"),
    h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},unreadCount>0?h("div",{style:{position:"relative",cursor:"pointer"},onclick:()=>S.go("notifications")},h("div",{style:{width:"34px",height:"34px",borderRadius:"9px",background:"#f472b622",border:"1px solid #f472b644",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px"}},"🔔"),h("span",{style:{position:"absolute",top:"-4px",right:"-4px",background:"var(--accent3)",color:"white",borderRadius:"8px",fontSize:"9px",padding:"1px 4px",fontWeight:700}},unreadCount)):null,
      S.user.avatar
        ?h("img",{loading:"lazy",src:S.user.avatar,style:{width:"34px",height:"34px",borderRadius:"50%",objectFit:"cover",cursor:"pointer",border:"2px solid var(--accent)"},onclick:()=>S.go("profile")})
        :h("div",{className:"avatar",style:{width:"34px",height:"34px",fontSize:"13px",cursor:"pointer"},onclick:()=>S.go("profile")},S.user.name[0])
    )
  );
  // FIX (root cause of "black screen on Community" and any similar report):
  // PageFn() used to be called directly inline. If ANY page component threw
  // while building its DOM tree, the exception propagated straight out of
  // render() — but root.innerHTML was already cleared a few lines above, so
  // the user was left with a totally empty #app and no sidebar/nav, i.e. a
  // black screen with no error message and no way to recover except closing
  // the app. Isolating just the page content in try/catch means a bug in
  // one page can no longer take down the whole app shell, and it's also
  // reported to the error monitor so it can actually be diagnosed.
  let pageContent;
  try{
    pageContent = PageFn();
  }catch(e){
    console.error('Page render failed for "'+S.page+'":', e);
    logErrorToCloud({ message: 'Render crash on page "'+S.page+'": '+e.message, stack: e.stack });
    pageContent = PageErrorFallback(e);
  }
  const appDiv=h("div",{className:"app"},overlay,Sidebar(),h("div",{className:"content"},mobileBar,pageContent));
  root.appendChild(appDiv);
  if(S.modal?.type==="edit")root.appendChild(EditModal(S.modal.data));
  if(S.modal?.type==="detail")root.appendChild(DetailModal(S.modal.data));
  if(S.modal?.type==="confirm")root.appendChild(ConfirmModal(S.modal.msg,S.modal.cb));

  if(S.modal?.type==="deleteAccount")root.appendChild(DeleteAccountModal());
  if(S.modal?.type==="blockedList")root.appendChild(BlockedAccountsModal());
  if(S.modal?.type==="faq")root.appendChild(FaqModal());
  if(S.modal?.type==="avatarCrop")root.appendChild(AvatarCropModal(S.modal.src,S.modal.onConfirm));
  // BUG FIX: showReportModal() (the 🚩 report button on other users'
  // artworks) built a modal via S.modal={type:'report', customWrap} and
  // called S.emit() — but render() never checked for type "report", so
  // the modal was built in memory and then simply never attached to the
  // page. Clicking 🚩 looked like it did nothing.
  if(S.modal?.type==="report")root.appendChild(ReportModal(S.modal.artworkId, S.modal.artworkTitle));
  if(S.modal?.type==="reportUser")root.appendChild(ReportUserModal(S.modal.uid, S.modal.name));

  if(S.modal?.type==="comments")root.appendChild(CommentsModal(S.modal.artworkId, S.modal.ownerUid, S.modal.artworkTitle, S.modal.artworkImage));
  if(S.modal?.type==="storyViewer")root.appendChild(StoryViewerModal(S.modal.uid, S.modal.stories, S.modal.index||0));
  if(S.modal?.type==="legal" && S.modal.doc==="privacy")root.appendChild(LegalModal("privacy"));
  if(S.modal?.type==="legal" && S.modal.doc==="terms")root.appendChild(LegalModal("terms"));
  if(S.toast)root.appendChild(ToastEl(S.toast.msg,S.toast.body,S.toast.action));
  // BUG FIX: the cookie-consent banner (fixed, bottom of screen, z-index
  // 500 — same as every modal's ".modal-bg" backdrop) was always appended
  // AFTER any open modal in the DOM. With equal z-index, later-appended
  // elements paint on top, so the banner's invisible rectangle sat over
  // the lower part of the screen and silently absorbed clicks meant for
  // whatever modal was open underneath it (Submit/Cancel/reason buttons
  // on the report modal, in particular — it "froze" because the buttons
  // were still there, just physically un-clickable). Only show it when
  // nothing else is open.
  if(!S.modal){
    const cookieBanner = CookieConsentBanner();
    if(cookieBanner) root.appendChild(cookieBanner);
  }
  // === Bottom ad banner (sticky, dismissible per session) ===
  const adBanner = BottomAdBanner();
  if(adBanner) document.body.appendChild(adBanner);
}

// ============================================================
// BOOT
// ============================================================
// FIX: waitForFirebase() used to wait forever with no timeout — if the
// Firebase SDK failed to load for any reason (blocked script, offline,
// slow network, or the file opened directly as file:// instead of being
// served over http/https), every auth button would hang permanently with
// no feedback. Now it times out and rejects with a clear error instead.
function waitForFirebase(timeoutMs){
  // If the device already reports no connection, don't make the boot
  // splash sit through the full 20s network timeout — Firebase Auth's
  // own persisted session (IndexedDB) resolves fast once the SDK module
  // itself is available (e.g. cached by the service worker), so a short
  // wait is enough; if the SDK truly can't load at all, fail fast into
  // the offline message instead of a long stuck splash.
  if(timeoutMs==null)timeoutMs=navigator.onLine?20000:6000;
  return new Promise((resolve,reject)=>{
    if(window.__firebaseReady)return resolve();
    const timer=setTimeout(()=>{
      window.removeEventListener('firebase-ready',onReady);
      reject(new Error('firebase-load-timeout'));
    },timeoutMs);
    function onReady(){clearTimeout(timer);resolve();}
    window.addEventListener('firebase-ready',onReady,{once:true});
  });
}

async function handleAuthChange(fbUser){
  // We now definitively know the auth state — safe to stop showing the
  // boot splash and reveal the real page (dashboard or the auth screen).
  S.booting=false;
  if(fbUser){
    try{
      let profile=await loadUserProfile(fbUser.uid);
      const isNewUser=!profile;
      if(!profile){
        profile=await createUserProfile(fbUser,fbUser.displayName||"Artist","Beginner");
      }
      S.user={uid:fbUser.uid,id:fbUser.uid,email:fbUser.email||profile.email||"",...profile};
      // Backfill isPublic=false for users created before the community
      // feature shipped — old profiles don't have the field at all.
      if(typeof S.user.isPublic !== 'boolean'){
        S.user.isPublic = false;
        try{ await saveUserProfile(fbUser.uid, {isPublic: false}); }catch(e){}
      }
      S.aiAdCredits = profile.aiAdCredits || 0;
      // FIX: the daily free-question quota used to live only in memory, so
      // it silently reset to full every time the page reloaded — a user
      // could just refresh to get unlimited questions instead of the
      // intended 5/day. Now it's restored from the cloud profile, and
      // ensureDailyReset() still handles the actual once-per-day reset.
      S.dailyFreeUsed = profile.dailyFreeUsed || 0;
      S.unlockedLessons = profile.unlockedLessons || [];
      S.dailyFreeDate = profile.dailyFreeDate || null;
      ensureDailyReset();
      S.profileForm={name:S.user.name,bio:S.user.bio||"",skill:S.user.skill};
      subscribeToEntries(fbUser.uid);
      subscribeToCloudNotifications(fbUser.uid);
      // FIX (root cause of "permission shows Allowed but push still never
      // arrives"): requestNotificationPermission() — the function that
      // actually fetches and saves the FCM token — was only ever called
      // from the soft-ask flow, which skips itself entirely once
      // Notification.permission is anything other than 'default'. So a
      // user who already granted permission before never got a fresh
      // token saved again on later visits, even if the old one went
      // stale (e.g. after clearing site data, which can invalidate the
      // underlying push subscription while leaving the OS-level
      // permission grant untouched). getToken() is safe and cheap to
      // call every boot — it just returns the same token if it's still
      // valid, or a new one if it had to rotate — so do it unconditionally
      // here whenever permission is already granted.
      if(typeof Notification !== 'undefined' && Notification.permission === 'granted' && VAPID_KEY){
        requestNotificationPermission(fbUser.uid).catch(e => console.warn('token refresh on boot failed:', e));
      }
      if(S.notifs.length===0)S.notifs=S.getDefaultNotifs();
      S.go("inspiration"); // Redirect to Inspiration page after login
      // Show welcome modal with inspiration images for ALL users
      S.modal={type:"welcome"};
      if(isNewUser){
        S.showToast(t("welcomeToast"),t("welcomeToastBody"));
        // FIX: this used to start the tour on an independent 1.2s timer,
        // regardless of whether the user had already dismissed the
        // welcome modal by then — the tour could pop up mid-action (e.g.
        // while they were already filling out their first entry). Now it
        // starts only once the welcome modal is actually closed (see its
        // button in WelcomeModal()), so the two never overlap or race.
        try {
          const seen = localStorage.getItem('sj_onboarding_done');
          if(!seen){
            S._startTourOnWelcomeClose = true;
            localStorage.setItem('sj_onboarding_done', '1');
          }
        } catch(e) {}
      }
    }catch(e){
      console.error('Auth profile load failed:',e);
      S.showToast("⚠️ Error","Could not load your profile. Please try again.");
    }
  }else{
    unsubscribeEntries();
    S.user=null;
    S.entries=[];
    S.aiAdCredits=0;
    S.dailyFreeUsed=0;S.dailyFreeDate=null;
    S.unlockedLessons=[];
    S.go("auth");
  }
}

(async()=>{
  await openDB();
  // Load local prefs (lang/theme) without auth data
  let _isDarkFromStorage = false;
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data=JSON.parse(raw);
      if(typeof data.isDark==='boolean'){S.isDark=data.isDark;_isDarkFromStorage=true;}
      if(['en','ar','tr'].includes(data.lang))S.lang=data.lang;
      _lang=S.lang;
      document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
      document.documentElement.lang=S.lang;
    }
  }catch(e){}
  // NEW: if the person has never explicitly chosen a theme (brand new
  // visit, nothing in storage yet), follow the OS/browser's own
  // light/dark setting instead of always defaulting to dark. Once they
  // toggle it manually (or this first-run detection runs once), the
  // saved value in storage takes over on every future visit as before.
  if(!_isDarkFromStorage){
    try{
      if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
        S.isDark = false;
      }
    }catch(e){}
  }
  document.body.className=S.isDark?'':'light';

  initializeAchievementTracking();
  initNetworkStatus();
  initVisibilityRefresh();
  // SECURITY FIX: kick off the server-trusted date fetch as early as
  // possible so the daily AI quota is anchored to the Worker's clock
  // (not the user's device clock) by the time they reach the AI page.
  // When the fetch resolves, re-emit so any AI page already on screen
  // picks up the now-correct daily counter.
  prefetchServerDate().then(() => {
    try{ ensureDailyReset(); }catch(e){}
    if(S.user) S.emit();
  });
  // Restore the daily reminder if the user previously enabled it
  try{ restoreDailyReminder(); }catch(e){}
  // Establish the current page as the baseline history entry, and listen
  // for the back/forward button so it navigates within the app (per the
  // history entries S.go() now pushes) instead of the browser handling it
  // as "there's nothing before this page, leave the site."
  try{ history.replaceState({page:S.page},''); }catch(e){}
  window.addEventListener('popstate',(e)=>{
    if(S.modal){
      // Back was pressed while a modal was open — close the modal instead
      // of navigating to the previous page. The history entry the modal
      // pushed is the one that was just consumed by this back navigation,
      // so mark it as no longer pending before emit() re-checks state.
      S._modalPushed=false;
      S.modal=null;
      S.emit();
      return;
    }
    const page=e.state?.page;
    if(page){ S.page=page; S.sidebarOpen=false; S.emit(); }
  });
  S.on(render);
  render();

  // Service Worker — registered immediately, independent of Firebase.
  // It used to sit after the Firebase try/catch block below, meaning it
  // waited on that block's full timeout (up to 20s) before ever running,
  // even though the two have nothing to do with each other. Offline
  // support shouldn't be held hostage by a slow/failed Firebase connection.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch((e)=>console.log('SW not available:',e.message));
  }

  try{
    await waitForFirebase();
    const f=fb();
    await handleGoogleRedirectResult();
    f.onAuthStateChanged(f.auth,handleAuthChange);
    listenForForegroundMessages();
  }catch(e){
    // FIX: previously an unguarded await here meant that if Firebase never
    // loaded (blocked script, no internet, or the file opened directly
    // instead of via a web server), the whole boot sequence silently froze
    // here forever — no auth listener got attached, and every button that
    // depended on Firebase would hang with no explanation. Now we surface
    // a clear, persistent message instead.
    console.error('Firebase failed to initialize:',e);
    S.booting=false; // stop showing the splash — reveal the auth page + toast below
    S.showToast(
      '⚠️ '+(_lang==='ar'?'تعذّر الاتصال':_lang==='tr'?'Bağlanılamadı':'Connection failed'),
      _lang==='ar'?'تعذّر تحميل خدمات التطبيق. تأكد من فتحه عبر رابط ويب (وليس بالنقر على الملف مباشرة)، وتحقق من اتصالك بالإنترنت، ثم أعد تحميل الصفحة.':_lang==='tr'?'Uygulama servisleri yüklenemedi. Uygulamayı bir web adresi üzerinden açtığınızdan (dosyaya çift tıklamak yerine) ve internete bağlı olduğunuzdan emin olup sayfayı yenileyin.':'App services failed to load. Make sure this is opened via a web address (not by double-clicking the file), check your internet connection, then refresh the page.'
    );
  }

  // PWA Install prompt
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    deferredPrompt=e;
    setTimeout(()=>{
      if(!deferredPrompt)return;
      const banner=document.createElement('div');
      banner.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#c084fc,#818cf8);color:white;padding:12px 20px;border-radius:14px;font-family:DM Sans,sans-serif;font-size:13px;font-weight:600;z-index:9998;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(192,132,252,0.4);cursor:pointer;white-space:nowrap';
      const txt=_lang==='ar'?'📲 تثبيت التطبيق':_lang==='tr'?'📲 Uygulamayı Yükle':'📲 Install App';
      banner.textContent=txt;
      banner.onclick=async()=>{
        deferredPrompt.prompt();
        const{outcome}=await deferredPrompt.userChoice;
        deferredPrompt=null;
        banner.remove();
      };
      const close=document.createElement('span');
      close.textContent='✕';close.style.cssText='margin-left:8px;opacity:0.7;cursor:pointer';
      close.onclick=e=>{e.stopPropagation();banner.remove();};
      banner.appendChild(close);
      document.body.appendChild(banner);
      setTimeout(()=>banner.remove(),8000);
    },3000);
  });
})();
</script>
