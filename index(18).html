  };
  await f.setDoc(f.doc(f.db,'users',fbUser.uid),profile);
  // No public profile yet — created lazily when user enables isPublic
  return profile;
}
async function loadUserProfile(uid){
  const f=fb();
  const snap=await f.getDoc(f.doc(f.db,'users',uid));
  return snap.exists()?snap.data():null;
}
async function saveUserProfile(uid,data){
  const f=fb();
  await f.setDoc(f.doc(f.db,'users',uid),data,{merge:true});
  // Keep the public profile in sync with privacy-relevant fields
  // (displayName, avatar, bio, skill, isPublic). Counters are updated
  // separately by syncPublicStats() to avoid stale snapshots.
  if('isPublic' in data || 'name' in data || 'avatar' in data || 'bio' in data || 'skill' in data){
    syncPublicProfile(uid, S.user, S.entries).catch(err => console.warn('public profile sync failed:', err));
  }
}

// ============================================================
// PUBLIC COMMUNITY — make social features real
// ============================================================
// Three collections back the community feature:
//
//   users_public/{uid}            — public profile (one doc per user)
//   users_public/{uid}/followers  — one doc per follower (presence = follow)
//   users_public/{uid}/following  — one doc per followed user
//   artworks_public/{artworkId}   — public artworks (opt-in per artwork)
//
// isPublic on the user's private profile controls whether their public
// profile exists at all. Each artwork also has its own isPublic flag —
// so a public user can still keep specific entries private.

// Cache of follower/following counts to avoid hitting Firestore for
// every render. Keyed by uid. Refreshed on demand by refreshMyCounts().
const _countCache = { followers: {}, following: {}, publicArtworks: {} };

async function syncPublicProfile(uid, user, entries){
  if(!uid || !user) return;
  const f=fb();
  if(!user.isPublic){
    // Opted out — remove the public doc so they disappear from Discover.
    try{
      await f.deleteDoc(f.doc(f.db,'users_public',uid));
    }catch(e){ /* doc may not exist; that's fine */ }
    return;
  }
  const publicArtworks = (entries||[]).filter(e => e.isPublic);
  await f.setDoc(f.doc(f.db,'users_public',uid),{
    uid,
    displayName: user.name || '',
    displayNameLower: (user.name || '').toLowerCase(),
    avatar: user.avatar || null,
    bio: user.bio || '',
    skill: user.skill || 'Beginner',
    joinedAt: user.joinedAt || new Date().toISOString(),
    artworkCount: publicArtworks.length,
    totalMins: (entries||[]).reduce((s,e)=>s+(e.timeSpent||0),0),
    isPublic: true,
    updatedAt: new Date().toISOString()
  }, { merge: true });
  // Also keep cached counts fresh for the current user
  _countCache.publicArtworks[uid] = publicArtworks.length;
  if(uid === S.user?.uid){
    S.myPublicArtworkCount = publicArtworks.length;
  }
}

async function refreshMyCounts(){
  if(!S.user?.uid) return;
  const f=fb();
  const myUid = S.user.uid;
  try{
    // FIX (root cause of Profile page "flicker"): S.emit() below used to
    // fire unconditionally every time this resolved (every 15s, per the
    // throttle above). Since ProfilePage() rebuilds its whole DOM tree —
    // including a .fade-in wrapper whose animation replays on every fresh
    // element — an emit with no real change still caused a visible flash
    // every 15s. Capture the prior values up front so we can only emit
    // when a count actually changed.
    const prevFollowing = S.user.following;
    const prevFollowers = S.user.followers;
    // Following = count of docs in my "following" subcollection
    const followingSnap = await f.getDocs(f.collection(f.db,'users_public',myUid,'following'));
    _countCache.following[myUid] = followingSnap.size;
    S.user.following = followingSnap.size;
    // Followers = count of docs in my "followers" subcollection
    const followersSnap = await f.getDocs(f.collection(f.db,'users_public',myUid,'followers'));
    _countCache.followers[myUid] = followersSnap.size;
    S.user.followers = followersSnap.size;
    const changed = prevFollowers !== followersSnap.size || prevFollowing !== followingSnap.size;
    if(changed) S.emit();
  }catch(e){
    console.warn('refreshMyCounts failed:', e);
  }
}

async function followUser(targetUid){
  if(!S.user?.uid || !targetUid || S.user.uid === targetUid) return false;
  const f=fb();
  const myUid = S.user.uid;
  try{
    // FIX (root cause of "can't follow anyone when my profile is
    // private"): this used to hard-block the entire follow action with
    // a "your profile is private" toast unless S.user.isPublic was true.
    // That's conflating two unrelated things — whether MY profile is
    // public only controls whether OTHER people can find/see ME; it has
    // nothing to do with my ability to follow someone else. The follow
    // relationship itself is written under the TARGET's own public
    // followers list (users_public/{targetUid}/followers/{myUid}), which
    // never actually depended on my own public profile existing. Only
    // sync my public profile if I have one enabled — never block the
    // follow itself on it.
    if(S.user.isPublic){
      await syncPublicProfile(myUid, S.user, S.entries);
    }
    // Atomic: write both sides in a transaction so a partial failure
    // can't leave us "following" someone who isn't following us back.
    await f.runTransaction(f.db, async (tx) => {
      const myFollowingRef   = f.doc(f.db,'users_public',myUid,'following',targetUid);
      const theirFollowerRef = f.doc(f.db,'users_public',targetUid,'followers',myUid);
      tx.set(myFollowingRef,   { timestamp: new Date().toISOString() });
      tx.set(theirFollowerRef, { timestamp: new Date().toISOString() });
    });
    // Optimistic local update
    _countCache.following[myUid] = (_countCache.following[myUid] || 0) + 1;
    S._followingSet = S._followingSet || new Set();
    S._followingSet.add(targetUid);
    S.user.following = (_countCache.following[myUid]);
    // NEW: actually notify the person being followed. This is a separate
    // write (not part of the transaction above) so a failure here — e.g.
    // a rules mismatch — never blocks or rolls back the follow itself,
    // which is the important part. See subscribeToCloudNotifications()
    // for how the target picks this up in their Notifications page.
    try{
      await f.setDoc(f.doc(f.db,'users',targetUid,'notifications', `follow_${myUid}`),{
        type: 'follow',
        fromUid: myUid,
        fromName: S.user.name || 'Someone',
        fromAvatar: S.user.avatar || null,
        read: false,
        time: new Date().toISOString()
      });
      sendPushNotification(
        targetUid,
        _lang==='ar'?'متابع جديد':_lang==='tr'?'Yeni takipçi':'New follower',
        `${S.user.name||'Someone'} ${_lang==='ar'?'بدأ يتابعك':_lang==='tr'?'seni takip etmeye başladı':'started following you'}`
      );
    }catch(e){ console.warn('follow notification failed:', e); }
    return true;
  }catch(e){
    console.error('followUser failed:', e);
    return false;
  }
}

async function unfollowUser(targetUid){
  if(!S.user?.uid || !targetUid) return false;
  const f=fb();
  const myUid = S.user.uid;
  try{
    await f.runTransaction(f.db, async (tx) => {
      const myFollowingRef   = f.doc(f.db,'users_public',myUid,'following',targetUid);
      const theirFollowerRef = f.doc(f.db,'users_public',targetUid,'followers',myUid);
      tx.delete(myFollowingRef);
      tx.delete(theirFollowerRef);
    });
    _countCache.following[myUid] = Math.max(0, (_countCache.following[myUid] || 0) - 1);
    S._followingSet = S._followingSet || new Set();
    S._followingSet.delete(targetUid);
    S.user.following = (_countCache.following[myUid]);
    return true;
  }catch(e){
    console.error('unfollowUser failed:', e);
    return false;
  }
}

// Hydrate the set of UIDs the current user follows, so the UI can show
// Follow / Following without a round-trip per profile card.
async function refreshFollowingSet(){
  if(!S.user?.uid) return;
  const f=fb();
  try{
    const snap = await f.getDocs(f.collection(f.db,'users_public',S.user.uid,'following'));
    S._followingSet = new Set(snap.docs.map(d => d.id));
  }catch(e){
    S._followingSet = S._followingSet || new Set();
  }
}

// ============================================================
// BLOCKING — lets someone stop an annoying account from following them,
// showing up in their Discover/Activity feeds, or interacting with their
// profile. This is enforced client-side (hiding/filtering + severing the
// follow relationship both directions) — it can't, on its own, stop a
// determined person from calling the API directly, since that needs a
// matching Firestore security rule too. Still worth having: it covers
// the app's normal UI entirely, which is what actually matters day to day.
// ============================================================
async function blockUser(targetUid, targetDisplayName){
  if(!S.user?.uid || !targetUid || S.user.uid === targetUid) return false;
  const f = fb();
  const myUid = S.user.uid;
  try{
    await f.setDoc(f.doc(f.db,'users',myUid,'blocked',targetUid),{
      blockedUid: targetUid,
      // NEW: snapshot the name at block time. Their public profile doc
      // (users_public/{uid}) gets deleted if they ever flip to private,
      // which would otherwise leave the Blocked Accounts list showing
      // nothing but a bare uid — this keeps it readable regardless.
      blockedName: targetDisplayName || '',
      blockedAt: new Date().toISOString()
    });
    // Sever any existing follow relationship in both directions — blocking
    // someone should also stop them following you, and stop you following
    // them, not just hide them going forward.
    try{
      await f.deleteDoc(f.doc(f.db,'users_public',myUid,'following',targetUid));
      await f.deleteDoc(f.doc(f.db,'users_public',targetUid,'followers',myUid));
      await f.deleteDoc(f.doc(f.db,'users_public',targetUid,'following',myUid));
      await f.deleteDoc(f.doc(f.db,'users_public',myUid,'followers',targetUid));
    }catch(e){ console.warn('block: follow cleanup failed (non-fatal):', e); }
    S._blockedSet = S._blockedSet || new Set();
    S._blockedSet.add(targetUid);
    S._followingSet?.delete(targetUid);
    return true;
  }catch(e){
    console.error('blockUser failed:', e);
    return false;
  }
}
async function unblockUser(targetUid){
  if(!S.user?.uid || !targetUid) return false;
  const f = fb();
  try{
    await f.deleteDoc(f.doc(f.db,'users',S.user.uid,'blocked',targetUid));
    S._blockedSet?.delete(targetUid);
    S._blockedDocs = (S._blockedDocs||[]).filter(d => d.uid !== targetUid);
    return true;
  }catch(e){
    console.error('unblockUser failed:', e);
    return false;
  }
}
async function refreshBlockedSet(){
  if(!S.user?.uid) return;
  const f = fb();
  try{
    const snap = await f.getDocs(f.collection(f.db,'users',S.user.uid,'blocked'));
    S._blockedSet = new Set(snap.docs.map(d => d.id));
    // NEW: keep the full docs too (uid, name, blockedAt) so the Blocked
    // Accounts list in Profile settings doesn't need a second round-trip.
    S._blockedDocs = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  }catch(e){
    S._blockedSet = S._blockedSet || new Set();
    S._blockedDocs = S._blockedDocs || [];
  }
}
function isUserBlocked(uid){
  return !!(S._blockedSet && S._blockedSet.has(uid));
}

// ============================================================
// STORIES — Instagram-style: post a photo, it shows as a gradient ring
// around the avatar, expires after 24h, and the owner can see a view count.
//
//   stories/{storyId}                      — one doc per story
//     ownerUid, ownerName, ownerAvatar, imageUrl, createdAt, expiresAt,
//     viewCount, posterDeviceId
//   stories/{storyId}/views/{deviceId}     — presence = "this device viewed it"
//                                             (also de-dupes the view counter)
//
// users_public/{uid}.lastStoryAt is kept in sync on every post so any
// screen showing a list of avatars (Discover, Following, Profile) can
// decide whether to light up the ring WITHOUT an extra query per card —
// it's already sitting on the profile doc they loaded anyway.
//
// NOTE on the view counter: this whole app requires signing in before any
// page (including a story) can even be opened — there's no route that
// bypasses AuthPage — so a literal "view from someone with zero account"
// isn't possible here. What "views without an account" means in practice
// is de-duping by DEVICE instead of by Firebase Auth account, via a random
// id persisted in localStorage (getDeviceViewerId() below). That's what
// lets opening your own story from a second browser/phone count as a
// view even while signed into the same account on both — at the cost of
// being approximate: clearing site data or using another browser resets
// the id, so the same real person CAN get counted more than once.
//
// IMPORTANT — like error_logs above, you need to add Firestore security
// rules for these two collections yourself (this file can't do that):
//   match /stories/{storyId} {
//     allow read: if true;
//     allow create: if request.auth != null
//       && request.resource.data.ownerUid == request.auth.uid;
//     allow delete: if request.auth != null
//       && request.auth.uid == resource.data.ownerUid;
//     allow update: if request.auth != null
//       && request.auth.uid != resource.data.ownerUid
//       && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['viewCount'])
//       && request.resource.data.viewCount == resource.data.viewCount + 1;
//     match /views/{deviceId} {
//       allow read: if request.auth != null
//         && request.auth.uid == get(/databases/$(database)/documents/stories/$(storyId)).data.ownerUid;
//       allow create: if request.auth != null; // keyed by device id, not uid — any signed-in visitor may record one
//       allow update, delete: if false;
//     }
//   }
// Without these, postStory()/recordStoryView() fail silently (permission-
// denied, caught below) and posting a story will show "could not post story".
// ============================================================
const STORY_TTL_MS = 24*60*60*1000;

function hasActiveStory(lastStoryAt){
  return !!(lastStoryAt && (Date.now() - new Date(lastStoryAt).getTime()) < STORY_TTL_MS);
}

// A random id for THIS browser/device, persisted in localStorage so it
// survives reloads. Used to de-dupe story views independently of which
// Firebase account is signed in — see the NOTE above. Falls back to a
// session-only id (not persisted) if localStorage is unavailable, e.g.
// private browsing — views still count for that one session at least.
function getDeviceViewerId(){
  try{
    let id = localStorage.getItem('sj_device_id');
    if(!id){
      id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
      localStorage.setItem('sj_device_id', id);
    }
    return id;
  }catch(e){
    if(!window.__sjSessionDeviceId){
      window.__sjSessionDeviceId = 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
    }
    return window.__sjSessionDeviceId;
  }
}

// --- "Seen" tracking, local to this device (localStorage), Instagram-style ---
// We track, per story-owner, the createdAt of the newest story THIS DEVICE
// has watched through. That's enough to (a) decide whether a ring should
// be the bright gradient (something new) or muted gray (already caught
// up), and (b) jump straight to the first unseen story when the viewer is
// reopened, instead of always restarting from story #1.
function getSeenUsersMap(){
  try{
    const raw = localStorage.getItem('sj_seen_story_users');
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function markUserStoriesSeenUpTo(ownerUid, createdAt){
  try{
    const map = getSeenUsersMap();
    if(!map[ownerUid] || new Date(createdAt) > new Date(map[ownerUid])){
      map[ownerUid] = createdAt;
      localStorage.setItem('sj_seen_story_users', JSON.stringify(map));
    }
  }catch(e){}
}
// 'none' = no active story at all, 'unseen' = has a story this device
// hasn't caught up to yet (bright ring), 'seen' = caught up (muted ring).
function storyRingState(lastStoryAt, ownerUid){
  if(!hasActiveStory(lastStoryAt)) return 'none';
  const seenAt = getSeenUsersMap()[ownerUid];
  if(seenAt && new Date(seenAt) >= new Date(lastStoryAt)) return 'seen';
  return 'unseen';
}

async function postStory(imageBase64){
  // Caller is expected to check S.user.isPublic first and toast a
  // specific message — a story is only ever meaningful on a public
  // profile (nobody could see it otherwise), so we just refuse quietly
  // here rather than duplicating that messaging in two places.
  if(!S.user?.uid || !S.user.isPublic) return false;
  const f=fb();
  const myUid=S.user.uid;
  const now=new Date();
  const expiresAt=new Date(now.getTime()+STORY_TTL_MS).toISOString();
  try{
    const ref=f.doc(f.collection(f.db,'stories'));
    await f.setDoc(ref,{
      ownerUid: myUid,
      ownerName: S.user.name||'',
      ownerAvatar: S.user.avatar||null,
      imageUrl: imageBase64,
      createdAt: now.toISOString(),
      expiresAt,
      viewCount: 0,
      posterDeviceId: getDeviceViewerId() // lets recordStoryView skip counting THIS device re-opening it
    });
    // Mirror lastStoryAt onto BOTH the public profile (so Discover/Following
    // cards can light up the ring without an extra query) and the private
    // users/{uid} doc (so it survives a reload — S.user is hydrated from
    // the private doc, not users_public, on every sign-in).
    await f.setDoc(f.doc(f.db,'users_public',myUid),{ lastStoryAt: now.toISOString() },{merge:true});
    await f.setDoc(f.doc(f.db,'users',myUid),{ lastStoryAt: now.toISOString() },{merge:true});
    S.user.lastStoryAt = now.toISOString();
    if(_countCache.profile?.[myUid]) _countCache.profile[myUid].lastStoryAt = now.toISOString();
    trackEvent('story_posted', {});
    return true;
  }catch(e){
    console.error('postStory failed:', e);
    return false;
  }
}

// All non-expired stories for one user, oldest first (so the viewer plays
// them in the order they were posted, like Instagram).
async function loadUserStories(uid){
  if(!uid) return [];
  const f=fb();
  try{
    const q = f.query(f.collection(f.db,'stories'), f.where('ownerUid','==',uid));
    const snap = await f.getDocs(q);
    const now = Date.now();
    return snap.docs
      .map(d => ({ id:d.id, ...d.data() }))
      .filter(s => new Date(s.expiresAt).getTime() > now)
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
  }catch(e){
    console.error('loadUserStories failed:', e);
    return [];
  }
}

// Records that THIS DEVICE viewed this story, once per device, and bumps
// the owner-visible view count. De-dupes by device id (see NOTE above),
// not by Firebase account — so it skips counting only when this is the
// exact device that originally posted the story, not merely "the same
// account signed in somewhere else".
async function recordStoryView(storyId, ownerUid, posterDeviceId){
  if(!storyId) return;
  const myDeviceId = getDeviceViewerId();
  if(posterDeviceId && myDeviceId === posterDeviceId) return; // this device is the one that posted it
  const f=fb();
  try{
    const viewRef = f.doc(f.db,'stories',storyId,'views',myDeviceId);
    const existing = await f.getDoc(viewRef);
    if(existing.exists()) return; // already counted from this device
    await f.runTransaction(f.db, async (tx) => {
      const storyRef = f.doc(f.db,'stories',storyId);
      const storySnap = await tx.get(storyRef);
      if(!storySnap.exists()) return;
      tx.set(viewRef, {
        viewerDeviceId: myDeviceId,
        viewerUid: S.user?.uid || null,
        viewerName: S.user?.name || 'Guest',
        viewedAt: new Date().toISOString()
      });
      tx.update(storyRef, { viewCount: (storySnap.data().viewCount||0) + 1 });
    });
  }catch(e){
    console.warn('recordStoryView failed:', e);
  }
}

// Shared by the Profile page and any avatar with a story ring (Discover /
// Following cards) — fetches that user's active stories and opens the
// full-screen viewer, starting at the first one this device hasn't
// caught up to yet (or from the top again if everything's been seen —
// same as tapping a muted/"seen" ring on Instagram).
async function openStoryViewer(uid){
  const stories = await loadUserStories(uid);
  if(!stories.length){
    S.showToast('📷 '+(_lang==='ar'?'ما فيه ستوري حالياً':_lang==='tr'?'Aktif hikaye yok':'No active story right now'),'');
    return;
  }
  const seenAt = getSeenUsersMap()[uid];
  let startIndex = 0;
  if(seenAt){
    const firstUnseen = stories.findIndex(s => new Date(s.createdAt) > new Date(seenAt));
    startIndex = firstUnseen === -1 ? 0 : firstUnseen;
  }
  S.modal = {type:'storyViewer', uid, stories, index:startIndex};
  S.emit();
}

async function deleteStory(storyId){
  if(!storyId) return false;
  const f=fb();
  try{
    await f.deleteDoc(f.doc(f.db,'stories',storyId));
    return true;
  }catch(e){
    console.error('deleteStory failed:', e);
    return false;
  }
}

// Get one user's public profile + cached counts (returns null if private)
async function getPublicProfile(uid){
  if(!uid) return null;
  const f=fb();
  // First check the local cache
  if(_countCache.profile?.[uid]) return _countCache.profile[uid];
  try{
    const snap = await f.getDoc(f.doc(f.db,'users_public',uid));
    if(!snap.exists()) return null;
    const data = snap.data();
    _countCache.profile = _countCache.profile || {};
    _countCache.profile[uid] = data;
    return data;
  }catch(e){
    return null;
  }
}

// Discover: list public users, excluding self, sorted by followers desc
async function loadDiscoverArtists(maxResults = 30){
  const f=fb();
  try{
    const q = f.query(
      f.collection(f.db,'users_public'),
      f.orderBy('updatedAt','desc'),
      f.limit(maxResults * 2) // overfetch so we can filter self out
    );
    const snap = await f.getDocs(q);
    const results = [];
    for(const docSnap of snap.docs){
      if(docSnap.id === S.user?.uid) continue;
      if(isUserBlocked(docSnap.id)) continue; // NEW: hide blocked accounts from Discover
      const data = docSnap.data();
      results.push({ uid: docSnap.id, ...data });
      if(results.length >= maxResults) break;
    }
    return results;
  }catch(e){
    console.error('loadDiscoverArtists failed:', e);
    return [];
  }
}

// Search public artists by name (prefix match on displayNameLower).

// Activity feed: latest public artworks from people I follow (or from
// everyone if I'm not following anyone yet, so the feed isn't empty)
async function loadActivityFeed(maxResults = 20){
  if(!S.user?.uid) return [];
  const f=fb();
  try{
    const followingSnap = await f.getDocs(
      f.collection(f.db,'users_public',S.user.uid,'following')
    );
    const followedUids = followingSnap.docs.map(d => d.id).filter(uid => !isUserBlocked(uid));
    // Firestore 'in' queries are limited to 30 — that's fine here.
    const ownerUids = followedUids.slice(0, 30);
    if(ownerUids.length === 0) return [];
    // Same composite-index trap as loadUserPublicArtworks: where('in',...)
    // + orderBy on a different field needs a composite index that doesn't
    // exist. Drop the orderBy, sort client-side instead.
    const q = f.query(
      f.collection(f.db,'artworks_public'),
      f.where('ownerUid','in',ownerUids),
      f.limit(maxResults * 2)
    );
    const snap = await f.getDocs(q);
    // FIX: the auto-hide-after-3-reports flag (isHidden) was being SET
    // correctly but never actually CHECKED anywhere — reported content
    // kept showing up in every feed regardless. Filter it out client-side
    // here (cheap since results are already capped at `maxResults`, and
    // avoids needing a new Firestore composite index for a server-side filter).
    return snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(a => !a.isHidden && !isUserBlocked(a.ownerUid))
      .sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')))
      .slice(0, maxResults);
  }catch(e){
    console.warn('loadActivityFeed failed (probably index missing):', e.message);
    return [];
  }
}

// Fetch a specific user's public artworks (used by PublicProfileModal)
async function loadUserPublicArtworks(uid, maxResults = 30){
  if(!uid) return [];
  const f=fb();
  try{
    // ROOT CAUSE of "Public Works (0)" on other users' profiles: this query
    // used to combine where('ownerUid','==',uid) with orderBy('createdAt'),
    // which Firestore requires a composite index for. That index didn't
    // exist in the project, so every call silently threw and was caught
    // below, returning []  —  even though the artworks were really there.
    // Fix: drop the orderBy from the query (single-field where needs no
    // composite index) and sort the small result set client-side instead.
    const q = f.query(
      f.collection(f.db,'artworks_public'),
      f.where('ownerUid','==',uid),
      f.limit(maxResults)
    );
    const snap = await f.getDocs(q);
    return snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(a => !a.isHidden)
      .sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  }catch(e){
    // FIX (diagnosing "public works shows 0 for other users"): log the
    // real Firestore error code/message so it's visible in DevTools —
    // this almost always means either (a) a missing composite index on
    // artworks_public for ownerUid + createdAt, which Firestore's error
    // message includes a direct "create it" link for, or (b) a security
    // rule blocking reads of another user's public artworks.
    console.error('loadUserPublicArtworks failed — code:', e.code, '— message:', e.message, e);
    return [];
  }
}

// ============================================================
// LIKES — real per-user like on public artworks
// ============================================================
// Storage:
//   artworks_public/{id}/likes/{userId}  → doc presence = liked
//   artworks_public/{id}.likeCount       → denormalized count for fast reads
//
// Like state is updated atomically via a transaction so the
// /likes subcollection and the likeCount field never disagree.

const _likedCache = new Set();  // artwork IDs the current user has liked
let _likedCacheHydrated = false;
async function hydrateLikedCache(){
  if(_likedCacheHydrated || !S.user?.uid) return;
  const f = fb();
  try{
    // We can only ask "which of MY likes exist" cheaply by storing
    // a per-user index — but that adds another collection. Cheaper
    // for now: just lazy-check when a specific artwork is shown.
    _likedCacheHydrated = true;
  }catch(e){}
}
async function isLiked(artworkId){
  if(!S.user?.uid || !artworkId) return false;
  if(_likedCache.has(artworkId)) return true;
  const f = fb();
  try{
    const snap = await f.getDoc(f.doc(f.db,'artworks_public',artworkId,'likes',S.user.uid));
    if(snap.exists()){ _likedCache.add(artworkId); return true; }
    return false;
  }catch(e){ return false; }
}
async function likeArtwork(artworkId){
  if(!S.user?.uid || !artworkId) return false;
  const f = fb();
  const myUid = S.user.uid;
  let ownerUid = null, artTitle = '', artImage = null;
  try{
    await f.runTransaction(f.db, async (tx) => {
      const artRef    = f.doc(f.db,'artworks_public',artworkId);
      const likeRef   = f.doc(f.db,'artworks_public',artworkId,'likes',myUid);
      const artSnap   = await tx.get(artRef);
      if(!artSnap.exists()) throw new Error('artwork-not-found');
      const artData = artSnap.data();
      const currentCount = artData.likeCount || 0;
      ownerUid = artData.ownerUid;
      artTitle = artData.title || '';
      artImage = artData.imageUrl || null;
      tx.set(likeRef, { timestamp: new Date().toISOString() });
      tx.update(artRef, { likeCount: currentCount + 1 });
    });
    _likedCache.add(artworkId);
    if(!S._myLikes) S._myLikes = new Set();
    S._myLikes.add(artworkId);
    // NEW: notify the artwork's owner, same pattern as follow notifications.
    // A separate write after the transaction, so a notification failure
    // (e.g. a rules mismatch) never blocks or rolls back the like itself.
    if(ownerUid && ownerUid !== myUid){
      try{
        await f.setDoc(f.doc(f.db,'users',ownerUid,'notifications', `like_${artworkId}_${myUid}`),{
          type: 'like',
          fromUid: myUid,
          fromName: S.user.name || 'Someone',
          fromAvatar: S.user.avatar || null,
          artworkId,
          artworkTitle: artTitle,
          // FIX (root cause of "don't know which of my artworks got the
          // comment/like"): include a thumbnail of the actual artwork so
          // NotificationsPage can show it directly, instead of the person
          // having to guess from just a name/title in text.
          artworkImage: artImage,
          read: false,
          time: new Date().toISOString()
        });
        sendPushNotification(
          ownerUid,
          _lang==='ar'?'إعجاب جديد':_lang==='tr'?'Yeni beğeni':'New like',
          artTitle
            ? `${S.user.name||'Someone'} ${_lang==='ar'?'أعجب بعملك':_lang==='tr'?'eserini beğendi':'liked your artwork'} "${artTitle}"`
            : `${S.user.name||'Someone'} ${_lang==='ar'?'أعجب بعملك':_lang==='tr'?'eserini beğendi':'liked your artwork'}`
        );
      }catch(e){ console.warn('like notification failed:', e); }
    }
    return true;
  }catch(e){
    console.error('likeArtwork failed:', e);
    return false;
  }
}
async function unlikeArtwork(artworkId){
  if(!S.user?.uid || !artworkId) return false;
  const f = fb();
  const myUid = S.user.uid;
  try{
    await f.runTransaction(f.db, async (tx) => {
      const artRef    = f.doc(f.db,'artworks_public',artworkId);
      const likeRef   = f.doc(f.db,'artworks_public',artworkId,'likes',myUid);
      const artSnap   = await tx.get(artRef);
      if(!artSnap.exists()) throw new Error('artwork-not-found');
      const currentCount = artSnap.data().likeCount || 0;
      tx.delete(likeRef);
      tx.update(artRef, { likeCount: Math.max(0, currentCount - 1) });
    });
    _likedCache.delete(artworkId);
    return true;
  }catch(e){
    console.error('unlikeArtwork failed:', e);
    return false;
  }
}

// ============================================================
// REPORTS — flag artwork for moderation
// ============================================================
// Storage:
//   reports/{autoId}  → top-level collection so admins can query
//                       across all artworks without a complex subcol.
//   artworks_public/{id}.reportCount → denormalized count
//   artworks_public/{id}.isHidden    → set to true when count >= 3
//
// One report per user per artwork (uid in doc id prevents dupes).

const REPORT_HIDE_THRESHOLD = 3;

// NEW: report a user's profile (not a specific artwork) — e.g. from
// their public profile page. Same duplicate-prevention pattern as
// reportArtwork (deterministic doc id so the same person can't spam
// reports), but no auto-hide threshold — profile reports go to a
// separate collection for manual review rather than automatically
// hiding an account.
async function reportUser(targetUid, reason){
  if(!S.user?.uid || !targetUid || S.user.uid === targetUid) return false;
  const f = fb();
  const myUid = S.user.uid;
  const reportId = `${targetUid}_${myUid}`;
  try{
    const reportRef = f.doc(f.db,'userReports',reportId);
    const existing = await f.getDoc(reportRef);
    if(existing.exists()) return 'duplicate';
    await f.setDoc(reportRef, {
      reportedUid: targetUid,
      reporterUid: myUid,
      reason: reason || 'unspecified',
      createdAt: new Date().toISOString()
    });
    return true;
  }catch(e){
    console.error('reportUser failed:', e);
    return false;
  }
}
async function reportArtwork(artworkId, reason){
  if(!S.user?.uid || !artworkId) return false;
  const f = fb();
  const myUid = S.user.uid;
  // Use a deterministic id so the same user can't double-report
  const reportId = `${artworkId}_${myUid}`;
  try{
    await f.runTransaction(f.db, async (tx) => {
      const reportRef = f.doc(f.db,'reports',reportId);
      const artRef    = f.doc(f.db,'artworks_public',artworkId);
      const reportSnap = await tx.get(reportRef);
      if(reportSnap.exists()){
        throw new Error('already-reported');
      }
      const artSnap = await tx.get(artRef);
      if(!artSnap.exists()) throw new Error('artwork-not-found');
      const currentCount = artSnap.data().reportCount || 0;
      const newCount = currentCount + 1;
      tx.set(reportRef, {
        artworkId, reporterUid: myUid,
        reason: reason || 'unspecified',
        createdAt: new Date().toISOString()
      });
      const update = { reportCount: newCount };
      if(newCount >= REPORT_HIDE_THRESHOLD) update.isHidden = true;
      tx.update(artRef, update);
    });
    return true;
  }catch(e){
    if(e.message === 'already-reported') return 'duplicate';
    console.error('reportArtwork failed:', e);
    return false;
  }
}

// COMMENTS — one level of replies (top-level comment + flat replies,
// like Instagram: replying to a reply just posts another reply to the

async function postComment(artworkId, ownerUid, artworkTitle, text, parentId = null){
  if(!S.user?.uid || !artworkId || !text?.trim()) return false;
  const f = fb();
  const myUid = S.user.uid;
  const trimmed = text.trim().slice(0, 500);
  try{
    const commentRef = f.doc(f.collection(f.db,'artworks_public',artworkId,'comments'));
    const commentData = {
      text: trimmed,
      authorUid: myUid,
      authorName: S.user.name || 'Someone',
      authorAvatar: S.user.avatar || null,
      parentId: parentId || null,
      createdAt: new Date().toISOString()
    };
    await f.setDoc(commentRef, commentData);
    // Best-effort counter bump + notification — a failure in either of
    // these shouldn't undo the comment itself, which already succeeded.
    let artImage = null;
    try{
      const artRef = f.doc(f.db,'artworks_public',artworkId);
      const artSnap = await f.getDoc(artRef);
      const cur = artSnap.exists() ? (artSnap.data().commentCount||0) : 0;
      artImage = artSnap.exists() ? (artSnap.data().imageUrl||null) : null;
      await f.setDoc(artRef, {commentCount: cur+1}, {merge:true});
    }catch(e){ console.warn('comment count update failed:', e); }
    if(ownerUid && ownerUid !== myUid){
      try{
        await f.setDoc(f.doc(f.db,'users',ownerUid,'notifications', `comment_${commentRef.id}`),{
          type: 'comment',
          fromUid: myUid,
          fromName: S.user.name || 'Someone',
          fromAvatar: S.user.avatar || null,
          artworkId,
          artworkTitle: artworkTitle || '',
          // FIX (root cause of "don't know which of my artworks got the
          // comment"): include a thumbnail of the actual artwork so
          // NotificationsPage can show it directly.
          artworkImage: artImage,
          commentText: trimmed.slice(0,120),
          read: false,
          time: new Date().toISOString()
        });
        sendPushNotification(
          ownerUid,
          _lang==='ar'?'تعليق جديد':_lang==='tr'?'Yeni yorum':'New comment',
          artworkTitle
            ? `${S.user.name||'Someone'} ${_lang==='ar'?'علّق على':_lang==='tr'?'şunu yorumladı':'commented on'} "${artworkTitle}": ${trimmed.slice(0,120)}`
            : `${S.user.name||'Someone'}: ${trimmed.slice(0,120)}`
        );
      }catch(e){ console.warn('comment notification failed:', e); }
    }
    return { id: commentRef.id, ...commentData };
  }catch(e){
    console.error('postComment failed:', e);
    return false;
  }
}
async function deleteComment(artworkId, commentId){

// ============================================================
// FIRESTORE ENTRIES SYNC
// ============================================================
let entriesUnsubscribe=null;
let notifsUnsubscribe=null;
// NEW: real-time listener for notifications OTHER people cause for me
// (currently just "so-and-so followed you" — see followUser()). These are
// merged into the same S.notifs array the local/device notifications
// (achievements, reminders) already use, de-duplicated by id, so they all
// show up together on the Notifications page.
function subscribeToCloudNotifications(uid, _retryCount){
  const f=fb();
  if(notifsUnsubscribe)notifsUnsubscribe();
  const q=f.query(f.collection(f.db,'users',uid,'notifications'));
  notifsUnsubscribe=f.onSnapshot(q,snap=>{
    // FIX (root cause of "notifications don't switch to Arabic when I
    // change the language"): this used to compute the icon/title/body
    // strings right here, baked in using whatever _lang was active at the
    // moment this Firestore listener fired — which is usually app boot,
    // long before any later language switch. Since onSnapshot only
    // re-fires when the underlying data actually changes (not when the
    // language changes), those strings just stayed frozen in the old
    // language forever. Now we keep only the raw data (type, fromName,
    // artworkTitle, commentText) and let NotificationsPage translate it
    // fresh on every render via resolveNotifText() — exactly like the
    // titleKey/bodyKey pattern already used for local notifications.
    const cloudNotifs = snap.docs.map(d=>{
      const data=d.data();
      return {
        id:'cloud_'+d.id,
        type:data.type,
        fromName:data.fromName||'Someone',
        commentText:data.commentText||'',
        time:data.time||new Date().toISOString(),
        read:!!data.read,
        fromUid:data.fromUid,
        fromAvatar:data.fromAvatar||null,
        artworkId:data.artworkId||null,
        artworkTitle:data.artworkTitle||'',
        artworkImage:data.artworkImage||null
      };
    });
    const localOnly = S.notifs.filter(n => !String(n.id).startsWith('cloud_'));
    S.notifs = [...cloudNotifs, ...localOnly].sort((a,b)=>String(b.time).localeCompare(String(a.time)));
    S.emit();
  },err=>{
    console.warn('Cloud notifications sync error:', err);
    // "Missing or insufficient permissions" right after sign-in can be a
    // genuine Firestore rules problem, but it's also exactly what happens
    // if this subscribes a split-second before Firebase auth has fully
    // settled request.auth for the rules check. Retry a couple of times
    // with a short delay before treating it as a real, persistent issue —
    // if it keeps failing after that, it's not a timing fluke.
    if((_retryCount||0) < 2 && String(err && err.code) === 'permission-denied'){
      setTimeout(() => subscribeToCloudNotifications(uid, (_retryCount||0) + 1), 1500);
    }
  });
}

function subscribeToEntries(uid){
  const f=fb();
  if(entriesUnsubscribe)entriesUnsubscribe();
  const q=f.query(f.collection(f.db,'users',uid,'entries'));
  entriesUnsubscribe=f.onSnapshot(q,async snap=>{
    const entries=[];
    for(const docSnap of snap.docs){
      // NEW: skip entries currently in their 5-second "undo" window (see
      // deleteEntryWithUndo) — the Firestore doc still exists until the
      // timer fires, but a fresh snapshot here (from an unrelated write)
      // would otherwise make a "deleted" item pop back into the gallery
      // for those few seconds.
      if(S._pendingDeleteIds && S._pendingDeleteIds.has(docSnap.id)) continue;
      const data={...docSnap.data(),id:docSnap.id};
      if(data.imageUrl&&typeof data.imageUrl==='string'&&data.imageUrl.startsWith('@@idb:')){
        // Extract the actual IDB key from the ref itself (works for both
        // the legacy single-image scheme `@@idb:{entryId}` and the newer
        // per-index scheme `@@idb:{entryId}_{i}` used by images[] below).
        const key=data.imageUrl.slice('@@idb:'.length);
        const img=await loadImageFromIDB(key);
        data.imageUrl=img||null;
      }
      // NEW: resolve every image in the images[] array the same way.
      if(Array.isArray(data.images) && data.images.length){
        const resolved=[];
        for(const ref of data.images){
          if(ref&&typeof ref==='string'&&ref.startsWith('@@idb:')){
            const key=ref.slice('@@idb:'.length);
            resolved.push(await loadImageFromIDB(key) || null);
          }else{
            resolved.push(ref);
          }
        }
        data.images=resolved.filter(Boolean);
        // Keep imageUrl (the cover) consistent with images[0] once
        // resolved, in case the two diverged (e.g. cover image failed
        // to load from IDB but a later image in the array is fine).
        if(data.images.length) data.imageUrl=data.images[0];
      }
      entries.push(data);
    }
    S.entries=entries;
    // NEW: track sync freshness for the "last synced" indicator in the
    // sidebar. snap.metadata.fromCache is true when this snapshot was
    // served from Firestore's local cache (offline, or before the first
    // server round-trip completes) rather than confirmed against the
    // server — surfaced as "syncing..." instead of a real timestamp.
    S._lastSyncedAt = new Date().toISOString();
    S._lastSyncFromCache = !!snap.metadata.fromCache;
    S.emit();
  },err=>{
    console.error('Entries sync error:',err);
    S.showToast(
      '⚠️ '+(_lang==='ar'?'انقطعت المزامنة':_lang==='tr'?'Senkronizasyon kesildi':'Sync disconnected'),
      _lang==='ar'?'تعذّر تحميل أعمالك من السحابة — تحقق من اتصالك وأعد تحميل الصفحة':_lang==='tr'?'Eserlerin yüklenemedi — bağlantını kontrol edip sayfayı yenile':'Could not load your artwork from the cloud — check your connection and refresh the page'
    );
    S.emit();
  });
}
async function saveEntryToCloud(uid,entry){
  const f=fb();
  const toSave={...entry};
  delete toSave.id;
  // NEW: each image in the images[] array is checked independently — a
  // multi-image entry can easily blow past Firestore's 1MB document limit
  // if every image stayed inline, so any single image over the threshold
  // gets its own IndexedDB-backed reference, same scheme as the original
  // single-image path (which this now also unifies with: legacy entries
  // that only ever had `imageUrl` still work unchanged below).
  if(Array.isArray(toSave.images) && toSave.images.length){
    const savedImages=[];
    for(let i=0;i<toSave.images.length;i++){
      const img=toSave.images[i];
      if(img&&img.length>700000){
        await saveImageToIDB(`${entry.id}_${i}`,img);
        savedImages.push(`@@idb:${entry.id}_${i}`);
      }else{
        savedImages.push(img);
      }
    }
    toSave.images=savedImages;
    toSave.imageUrl=savedImages[0]||null;
  }else if(toSave.imageUrl&&toSave.imageUrl.length>700000){
    await saveImageToIDB(entry.id,toSave.imageUrl);
    toSave.imageUrl=`@@idb:${entry.id}`;
  }
  await f.setDoc(f.doc(f.db,'users',uid,'entries',entry.id),toSave);
  // Mirror to the public collection if user opted in + entry is public.
  // Fire-and-forget so a public-write failure doesn't block the private
  // save (the user can re-publish later). The S.entries snapshot we
  // keep in memory is always the source of truth for the local UI.
  if(S.user?.isPublic && toSave.isPublic){
    // BUG FIX: this used to pass `toSave` here, but `toSave.id` was deleted
    // a few lines above (needed so the private doc write doesn't store a
    // redundant `id` field) — so publishArtwork(toSave) received
    // entry.id === undefined and wrote to a random auto-generated doc ID
    // in artworks_public instead of a stable one, or silently failed.
    // Passing the original `entry` (untouched id + untouched real
    // imageUrl) fixes both this and a related large-image bug.
    publishArtwork(entry).catch(err => console.warn('public publish failed:', err));
    // Update public profile counters so Discover shows accurate counts
    syncPublicProfile(uid, S.user, S.entries).catch(err => console.warn('public profile resync failed:', err));
  }else if(toSave.isPublic && !S.user?.isPublic){
    // Edge case: artwork flagged public but user is private — don't
    // publish, but warn so they know why it isn't visible.
    console.info('Entry marked public but user profile is private; artwork will stay private.');
  }else{
    // Entry not public — make sure it isn't lingering in the public
    // collection from a previous state.
    unpublishArtwork(entry.id).catch(err => console.warn('unpublish failed:', err));
  }
}
async function deleteEntryFromCloud(uid,entryId,entry){
  const f=fb();
  await deleteImageFromIDB(entryId); // legacy single-image key, harmless no-op if absent
  // NEW: also clean up per-index IDB keys used by multi-image entries
  // (images[0] uses `${entryId}_0`, images[1] uses `${entryId}_1`, etc.)
  // — otherwise deleted entries would leave orphaned images sitting in
  // IndexedDB forever, slowly eating the storage quota shown in Profile.
  const imgCount = entry?.images?.length || 0;
  for(let i=0;i<imgCount;i++){
    await deleteImageFromIDB(`${entryId}_${i}`);
  }
  await f.deleteDoc(f.doc(f.db,'users',uid,'entries',entryId));
  // Also remove from public collection
  unpublishArtwork(entryId).catch(err => console.warn('unpublish on delete failed:', err));
  // Refresh public profile counters
  if(S.user?.isPublic){
    syncPublicProfile(uid, S.user, S.entries).catch(err => console.warn('public profile resync failed:', err));
  }
}

// ============================================================
// DELETE WITH UNDO — Instagram/Gmail-style: hide the entry immediately
// (optimistic), give the person a few seconds to change their mind via
// a toast action, and only actually delete once that window passes
// without an undo. Replaces the old "confirm modal → delete forever"
// flow, which had no way back once you'd tapped through it.
// ============================================================
function deleteEntryWithUndo(entry){
  S._pendingDeleteIds = S._pendingDeleteIds || new Set();
  S._pendingDeleteIds.add(entry.id);
  // Optimistically hide it from the local list right away.
  S.entries = S.entries.filter(x => x.id !== entry.id);
  S.emit();
  let undone = false;
  const UNDO_WINDOW_MS = 5000;
  const finalize = async () => {
    if(undone) return;
    S._pendingDeleteIds?.delete(entry.id);
    try{
      if(S.user?.uid){
        await deleteEntryFromCloud(S.user.uid, entry.id, entry);
      }else{
        await deleteImageFromIDB(entry.id);
        // NEW: multi-image cleanup for the local-only (not signed in) path too
        const imgCount = entry?.images?.length || 0;
        for(let i=0;i<imgCount;i++){ try{ await deleteImageFromIDB(`${entry.id}_${i}`); }catch(e){} }
      }
    }catch(err){
      notifyCloudDeleteError(err);
    }
  };
  const timer = setTimeout(finalize, UNDO_WINDOW_MS);
  S.showToast(
    '🗑️ ' + (_lang==='ar'?'تم الحذف':_lang==='tr'?'Silindi':'Deleted'),
    `"${entry.title}"`,
    {
      label: _lang==='ar'?'تراجع':_lang==='tr'?'Geri al':'Undo',
      onClick: () => {
        undone = true;
        clearTimeout(timer);
        S._pendingDeleteIds?.delete(entry.id);
        // Put it back — the cloud doc was never touched, so this is
        // just restoring local state; the next real snapshot (if any
        // arrives) will confirm it's still there.
        if(!S.entries.some(x => x.id === entry.id)){
          S.entries = [entry, ...S.entries];
        }
        S.emit();
      }
    },
    UNDO_WINDOW_MS + 500
  );
}

// Generic helper for any blocking network action (sign in, AI request...):
// shows `loadingText` right away, then swaps to a "still working / slow
// connection?" hint if it's still pending after `slowAfterMs`. This way a
// user on a weak connection always sees visible proof the app hasn't
// frozen, instead of a button/label that looks stuck with no feedback.
// `setText` is a small callback so this works whether the caller updates a
// button's textContent, a status dot's label, or anything else.
function withSlowNetworkHint(setText,loadingText,slowAfterMs=4000){
  setText(loadingText);
  const timer=setTimeout(()=>setText(t("stillConnecting")),slowAfterMs);
  return ()=>clearTimeout(timer);

// Previously the ONLY way to enable push notifications was digging into
// Profile → Settings and tapping "Enable Notifications" — most users never
// do that, so almost nobody actually received them. The browser itself
// requires an explicit user gesture + native permission prompt for every
// site (no code can skip that, on any platform), but we can dramatically
// raise how many people say yes by asking at a good moment, with our own
// friendly explanation first, instead of leaving it buried in Settings.
// This fires once per device (tracked in localStorage) the first time the
// user reaches a natural "things are going well" moment — closing the
// Welcome modal or finishing/skipping the onboarding tour — and only if
// permission hasn't already been granted or denied.
function maybeShowNotifSoftAsk(){
  try{
    if(!('Notification' in window)) return;
    if(!VAPID_KEY) return;
    if(Notification.permission !== 'default') return; // already decided — nothing to ask

    localStorage.setItem('sj_notif_softask_seen','1');
    S.modal={type:'notifSoftAsk'};
    S.emit();
  }catch(e){}
}

async function requestNotificationPermission(uid, _isRetry){
  if(!('Notification' in window)){
    console.warn('Notifications not supported in this browser');
    return {ok:false,reason:'unsupported'};
  }
  if(!VAPID_KEY){
    console.warn('VAPID key not set — push notifications disabled.');
    return {ok:false,reason:'no-vapid-key'};
  }
  try{
    const permission = await Notification.requestPermission();
    console.log('Notification permission result:', permission);
    if(permission !== 'granted'){
      return {ok:false,reason:'denied'};
    }
    const f = fb();
    if(!f.messaging){
      console.error('Firebase messaging not initialized');
      return {ok:false,reason:'unsupported'};
    }
    // Wait for service worker to be ready (it's registered in BOOT already)
    const swReg = await navigator.serviceWorker.ready;
    console.log('Service worker ready:', swReg);
    const token = await f.getToken(f.messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: swReg
    });
    console.log('FCM Token obtained:', token ? token.substring(0,20)+'...' : 'NONE');
    if(token && uid){
      await saveUserProfile(uid, {fcmToken: token, fcmEnabledAt: new Date().toISOString()});
      // Also save to a shared collection so we can broadcast to everyone easily
      await f.setDoc(f.doc(f.db,'fcmTokens',uid),{
        token, uid,
        userName: S.user?.name || '',
        updatedAt: new Date().toISOString()
      });
    }
    return {ok:true,token};
  }catch(e){
    // FIX (root cause of push not arriving even on desktop): right after
    // the service worker updates/activates — especially the very first
    // time, or right after a manual re-register — there's a brief window
    // where navigator.serviceWorker.ready has already resolved but the
    // browser's PushManager hasn't fully synced with the newly active
    // worker yet. Calling getToken() in that window throws exactly this
    // AbortError ("no active Service Worker"), even though the worker
    // genuinely is active moments later. Retry once after a short delay
    // instead of silently giving up — this is a timing issue, not a real
    // failure.
    const msg = String(e && e.message || e);
    if(!_isRetry && msg.includes('no active Service Worker')){
      console.warn('Push subscribe hit the activation race — retrying in 2s...');
      await new Promise(r => setTimeout(r, 2000));
      return requestNotificationPermission(uid, true);
    }
    console.error('Notification permission error:', e);
    return {ok:false,reason:'error',error:e};
  }
}

// ============================================================
// PUSH NOTIFICATIONS  (foreground + local reminders)
// ============================================================
// Real push delivery requires Cloud Functions on the Firebase backend
// to send FCM messages when follow / like / report events fire. We
// don't have those, but we can still:
//
//   (a) Receive foreground FCM messages (when app is open) and show
//       them both in the in-app notification list AND as a native
//       browser Notification (so the user sees it even if the tab
//       isn't focused).
//   (b) Schedule a local daily "remind me to draw" notification via
//       the Service Worker, so users get a gentle nudge once a day
//       even without a backend.
//   (c) For in-app events (follow, like) where the actor is the
//       current user, we add a local in-app notification entry so the
//       "Notifications" page isn't empty.
function listenForForegroundMessages(){
  const f = fb();
  if(!f.messaging) return;
  f.onMessage(f.messaging, payload => {
    const title = payload.notification?.title || 'Sketch Journey';
    const body = payload.notification?.body || '';
    pushInAppNotification({icon:'🔔', title, body, source:'fcm'});
    S.showToast(title, body);
    // Also show a native Notification (works even if the tab is in
    // the background) — but only if the user has granted permission.
    if('Notification' in window && Notification.permission === 'granted'){

// Schedule a local "draw today" reminder for the same time tomorrow
// (and every 24h after). Uses the Notification Triggers API where
// available, with a setTimeout fallback otherwise. The user must have
// notifications enabled for this to show anything.
async function scheduleDailyReminder(hour = 19, minute = 0){
  if(!('Notification' in window) || Notification.permission !== 'granted') return false;
  // FIX (root cause of "reminder arrives twice / late / in the wrong
  // language"): this used to ALSO run a local setTimeout that showed its
  // own notification, completely independent of — and racing against —
  // the reliable server-side Cron Trigger reminder. The local one only
  // ever fired if this browser tab happened to still be open, could
  // drift by several minutes, and used whatever _lang happened to be
  // active at that exact moment rather than the person's saved
  // preference. The server-side reminder now handles delivery properly
  // (works even when the app is closed, sends in each person's saved
  // language), so this function's only job now is to record the chosen
  // time — locally for display, and server-side for the Cron Worker to
  // actually act on.
  localStorage.setItem('sj_reminder_hour', String(hour));
  localStorage.setItem('sj_reminder_minute', String(minute));
  await saveReminderPrefsToServer(hour, minute, true);
  return true;
}
function clearDailyReminder(){
  localStorage.removeItem('sj_reminder_hour');
  localStorage.removeItem('sj_reminder_minute');
}

  // now the single source of truth for delivery, driven by what's saved
  // on fcmTokens/{uid}. Nothing to do here at boot.
}
// Converts the user's chosen LOCAL hour/minute into UTC (since the
// Cloudflare Worker's Cron Trigger always runs on UTC) and saves it to
// the same fcmTokens/{uid} doc the Worker already reads for the push
// token — keeping everything the Worker needs to know about a user's
// reminder in one place.
async function saveReminderPrefsToServer(hour, minute, enabled){
  if(!S.user?.uid) return;
  const f = fb();
  if(!f) return;
  try{
    let hourUTC = null, minuteUTC = null;
    if(enabled && hour !== null && minute !== null){
      const localTarget = new Date();
      localTarget.setHours(hour, minute, 0, 0);
      hourUTC = localTarget.getUTCHours();
      minuteUTC = localTarget.getUTCMinutes();
    }
    await f.setDoc(f.doc(f.db,'fcmTokens',S.user.uid), {
      reminderEnabled: !!enabled,
      reminderHourUTC: hourUTC,
      reminderMinuteUTC: minuteUTC,
      // NEW (root cause of "reminder always arrives in Arabic no matter
      // what"): the Worker had no way to know each person's language
      // preference, so it sent the same fixed text to everyone. Saving
      // it here lets the Worker pick the right one per person.
      lang: _lang
    }, {merge:true});
  }catch(e){ console.warn('saveReminderPrefsToServer failed:', e); }
}

// Real total usage across ALL localStorage keys (not just STORAGE_KEY) —
// this is what actually determines whether the browser will reject writes.
function getTotalLocalStorageSize(){
  let total=0;
  try{
    for(let i=0;i<localStorage.length;i++){

const DB_NAME='SketchJourneyDB',DB_VERSION=1,IMAGES_STORE='images';

function compressImage(base64,maxWidth=800,quality=0.75){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxWidth){h=(h*maxWidth)/w;w=maxWidth;}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);

    };

let _lsQuotaWarned=false; // avoid spamming the same toast on every save
async function saveState(){
  try{
    const data={isDark:S.isDark,lang:S.lang,insSaved:S.insSaved};
    const serialized=JSON.stringify(data);
    // Enforce MAX_LS_SIZE: check total usage (this key plus everything else
    // — the API key, Firestore's own offline cache is IndexedDB so it
    // doesn't count here) before writing, so we fail predictably instead of
    // letting the browser throw QuotaExceededError mid-write.
    const currentOther=getTotalLocalStorageSize()-(localStorage.getItem(STORAGE_KEY)||'').length;
    if(currentOther+serialized.length>MAX_LS_SIZE){
      console.warn('Local storage near capacity — skipping save to avoid quota error.');
      if(!_lsQuotaWarned){
        _lsQuotaWarned=true;
        S.showToast(
          '⚠️ '+(_lang==='ar'?'التخزين المحلي ممتلئ':_lang==='tr'?'Yerel depolama dolu':'Local storage full'),
          _lang==='ar'?'بعض التفضيلات قد لا تُحفظ — امسح البيانات من الإعدادات لتحرير مساحة':_lang==='tr'?'Bazı tercihler kaydedilmeyebilir — yer açmak için ayarlardan verileri temizleyin':'Some preferences may not save — clear data in Settings to free up space'
        );

      }
      return;
    }
    localStorage.setItem(STORAGE_KEY,serialized);
  }catch(e){
    // QuotaExceededError can still happen (e.g. another tab filled storage
    // between our check and this write) — surface it instead of swallowing it.
    console.error('saveState failed:',e);
    if(!_lsQuotaWarned){
      _lsQuotaWarned=true;
      S.showToast(
        '⚠️ '+(_lang==='ar'?'تعذّر الحفظ محليًا':_lang==='tr'?'Yerel kayıt başarısız':'Local save failed'),
        _lang==='ar'?'التخزين المحلي ممتلئ أو غير متاح':_lang==='tr'?'Yerel depolama dolu veya kullanılamıyor':'Local storage is full or unavailable'

}

function h(tag,attrs={},...children){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="className")el.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on")){const sig=currentController?.signal;if(sig)el.addEventListener(k.slice(2).toLowerCase(),v,{signal:sig});else el.addEventListener(k.slice(2).toLowerCase(),v);}

  }
  children.flat(Infinity).forEach(c=>{if(c===null||c===undefined||c===false)return;el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);});
  return el;
}

    countEl.appendChild(document.createTextNode(`${f.length} ${t("artworksFound")}`));
    if(S.gTag)countEl.appendChild(h("span",{className:"badge",style:{marginInlineStart:"8px",fontSize:"11px"},onclick:()=>{S.gTag="";tagSel.value="";renderCards();}},`🏷️ ${S.gTag} ✕`));
    grid.innerHTML="";
    if(f.length===0)grid.appendChild(h("div",{style:{textAlign:"center",padding:"60px 0",color:"var(--muted)",gridColumn:"1/-1"}},h("div",{style:{fontSize:"40px",marginBottom:"12px"}},"🎨"),t("noArtworks")));
    else {
      // === LAZY LOADING: render first 12, then 8 more as user scrolls ===
      const INITIAL_BATCH = 12;
      const BATCH_SIZE = 8;
      let loaded = 0;
      const sentinel = h('div',{style:{height:'20px',gridColumn:'1/-1'}});
      let observer = null;
      const loadMore = () => {
        const next = f.slice(loaded, loaded + BATCH_SIZE);
        next.forEach((e,i) => grid.insertBefore(ArtCard(e, loaded+i, true), sentinel));
        loaded += next.length;
        if(loaded >= f.length && observer){
          observer.disconnect();
          observer = null;
        }
      };
      // First batch immediately so the page is responsive
      f.slice(0, INITIAL_BATCH).forEach((e,i)=>grid.appendChild(ArtCard(e,i,true)));
      loaded = Math.min(INITIAL_BATCH, f.length);
      grid.appendChild(sentinel);
      if(loaded < f.length && 'IntersectionObserver' in window){
        observer = new IntersectionObserver((entries)=>{
          if(entries[0].isIntersecting) loadMore();
        }, {rootMargin:'200px'});
        observer.observe(sentinel);
      } else {
        // Fallback: load everything if IntersectionObserver not supported
        while(loaded < f.length) loadMore();
      }
    }
  }
  renderCards();return wrap;
}
function openFilePicker(callback){
  const input=document.createElement("input");
  input.type="file";
  input.accept="image/*";
  input.onchange=async e=>{
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>10485760){S.showToast("⚠️ File too large","Max 10MB");return;}
    try{
      const reader=new FileReader();
      reader.onload=async ev=>{
        const orig=ev.target.result;
        const comp=await compressImage(orig,800,0.75);
        callback(comp);
        const r=Math.round((1-comp.length/orig.length)*100);
        if(r>0)S.showToast("🗜️ Compressed",`Reduced by ${r}%`);
      };
      reader.readAsDataURL(file);
    }catch(err){
      const r=new FileReader();
      r.onload=ev=>{callback(ev.target.result);};
      r.readAsDataURL(file);
    }
  };
  input.click();
}

function SecurityBanner(){
  // Only show for users signed in with a verified provider
  if(!S.user?.uid) return null;
  const fbUser = fb()?.auth?.currentUser;
  if(!fbUser) return null;
  const banners = [];
  // ----- Email verification banner -----
  // Skip for OAuth (Google) users — they come pre-verified.
  const isPasswordProvider = fbUser.providerData.some(p => p.providerId === 'password');
  if(isPasswordProvider && !fbUser.emailVerified){
    banners.push(h("div",{
      className:"glass",
      style:{
        padding:"12px 16px",marginBottom:"16px",
        background:"#fbbf2411",border:"1px solid #fbbf2444",

        h("div",{style:{fontWeight:700,fontSize:"13px",color:"var(--warning)"}},

        h("div",{style:{fontSize:"12px",color:"var(--muted)"}},
          _lang==='ar'?'أرسلنا رابط التأكيد إلى بريدك':_lang==='tr'?'Onay bağlantısı e-postanıza gönderildi':'We sent a confirmation link to your email'
        )
      ),
      h("button",{
        className:"btn btn-g",style:{padding:"7px 14px",fontSize:"12px",flexShrink:0},
        id:"resend-verify-btn",
        onclick:async (e) => {
          const btn = e.target;
          btn.disabled = true;
          btn.textContent = _lang==='ar'?'جاري الإرسال...':_lang==='tr'?'Gönderiliyor...':'Sending...';
          try{
            await fb().sendEmailVerification(fb().auth.currentUser);
            S.showToast('✅ '+(_lang==='ar'?'تم إعادة إرسال الرابط':_lang==='tr'?'Bağlantı tekrar gönderildi':'Link resent'));
          }catch(err){
            S.showToast('⚠️', err.message);
          }
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = _lang==='ar'?'إعادة إرسال':_lang==='tr'?'Tekrar gönder':'Resend';
          }, 60000);
        }
      },_lang==='ar'?'إعادة إرسال':_lang==='tr'?'Tekrar gönder':'Resend')
    ));
  }
  if(banners.length === 0) return null;
  return h("div",{},...banners);
}

function showRewardedAdModal(onComplete, subText){
  const overlay = h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:99999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"20px"}});
  const title = _lang==='ar'?'📺 جاري عرض الإعلان...':_lang==='tr'?'📺 Reklam gösteriliyor...':'📺 Showing Ad...';
  const sub = subText || (_lang==='ar'?'سيُفتح 4 طلبات AI مجانية عند الانتهاء':_lang==='tr'?'Bittiğinde 4 ücretsiz AI isteği açılacak':'4 free AI requests will unlock when this finishes');
  const titleEl = h("div",{style:{color:"white",fontSize:"20px",fontWeight:700,fontFamily:"Fraunces,serif"}},title);
  const subEl = h("div",{style:{color:"rgba(255,255,255,0.7)",fontSize:"13px"}},sub);
  const countEl = h("div",{style:{fontSize:"48px",fontWeight:700,color:"var(--accent)"}},"5");
  const bar = h("div",{style:{width:"240px",height:"6px",background:"rgba(255,255,255,0.15)",borderRadius:"3px",overflow:"hidden"}},
    h("div",{id:"ad-progress",style:{width:"0%",height:"100%",background:"linear-gradient(90deg,var(--accent),var(--accent2))",transition:"width 1s linear"}})
  );
  overlay.appendChild(titleEl);
  overlay.appendChild(subEl);
  overlay.appendChild(countEl);
  overlay.appendChild(bar);
  document.body.appendChild(overlay);

  let seconds = 5;
  const progressBar = bar.querySelector('#ad-progress');
  const interval = setInterval(() => {
    seconds--;
    countEl.textContent = seconds > 0 ? seconds : '✓';
    progressBar.style.width = `${((5-seconds)/5)*100}%`;
    if(seconds <= 0){
      clearInterval(interval);
      setTimeout(() => {
        overlay.remove();
        if(onComplete) onComplete();
      }, 500);
    }
  }, 1000);

  // ⚠️ TODO: Replace this 5-second timer with real ad SDK call (Adsterra/PropellerAds)
  // when you integrate a real ad network. The onComplete() callback is what
  // grants the free AI credit — call it only after a real ad finishes playing.
}

                    S.showToast('⚠️', _lang==='ar'?'تعذّر إلغاء اللايك — تحقق من الاتصال':_lang==='tr'?'Beğeni kaldırılamadı':'Could not remove like');

                }else{
                  const ok = await likeArtwork(art.id);
                  if(ok){
                    likeState.liked = true;
                    likeState.count++;
                    trackEvent('like', {});
                    heartBtn.textContent = `♥ ${likeState.count}`;
                    heartBtn.style.color = '#f472b6';
                  }else{
                    S.showToast('⚠️', _lang==='ar'?'تعذّر تسجيل اللايك — تحقق من الاتصال':_lang==='tr'?'Beğenilemedi':'Could not like this');

                }
              }
            }, `♡ ${likeState.count}`);

                likeState.liked = true;
                heartBtn.textContent = `♥ ${likeState.count}`;
                heartBtn.style.color = '#f472b6';
              }
            });
            // NEW: double-tap-to-like on the image itself, Instagram-style —
            // shows a big heart that pops and fades regardless of whether
            // the like succeeds (so it always feels responsive), while the
            // actual like only fires once per not-yet-liked artwork (never
            // un-likes on a second double-tap, same as Instagram).
            async function doLike(){
              if(!S.user){ S.showToast('⚠️', _lang==='ar'?'سجّل دخول أولاً':_lang==='tr'?'Önce giriş yapın':'Sign in first'); return; }
              if(likeState.liked) return; // already liked — just show the heart burst, no network call needed
              const ok = await likeArtwork(art.id);
              if(ok){
                likeState.liked = true;
                likeState.count++;
                trackEvent('like', {});
                heartBtn.textContent = `♥ ${likeState.count}`;
                heartBtn.style.color = '#f472b6';
              }
            }
            let lastTap = 0;
            const heartBurst = h("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",fontSize:"52px",opacity:0,transform:"scale(0.5)",transition:"opacity .25s, transform .25s",zIndex:2}},"❤️");
            const imgWrap = h("div",{
              style:{height:"100px",background:"linear-gradient(135deg,#c084fc44,#818cf822)",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden",cursor:"pointer"},
              onclick:(e) => {
                e.stopPropagation();
                const now = Date.now();
                if(now - lastTap < 350){
                  doLike();
                  heartBurst.style.opacity = '1';
                  heartBurst.style.transform = 'scale(1.1)';
                  setTimeout(() => {
                    heartBurst.style.opacity = '0';
                    heartBurst.style.transform = 'scale(1.4)';
                  }, 400);
                }
                lastTap = now;
              }
            },
              art.imageUrl ? h("img",{loading:"lazy",src:art.imageUrl,style:{width:"100%",height:"100%",objectFit:"cover"}}) : h("span",{style:{fontSize:"24px"}},"🎨"),
              heartBurst
            );
            return h("div",{className:"art-card",style:{cursor:"default"}},
              imgWrap,
              h("div",{style:{padding:"8px"}},
                h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}},
                  h("div",{style:{fontWeight:600,fontSize:"12px",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},art.title),
                  !isMe ? h("button",{
                    style:{background:"none",border:"none",cursor:"pointer",fontSize:"14px",color:"var(--dim)",padding:"0 4px"},
                    title:_lang==='ar'?'إبلاغ':_lang==='tr'?'Bildir':'Report',
                    onclick:(e) => {
                      e.stopPropagation();
                      showReportModal(art.id, art.title);
                    }
                  },"🚩") : null
                ),
                h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
                  h("div",{style:{fontSize:"10px",color:"var(--muted)"}},catLabel(art.category)+' · '+fmtDate(art.createdAt)),
                  h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
                    h("button",{
                      style:{background:"none",border:"none",cursor:"pointer",fontSize:"17px",color:"var(--dim)",display:"flex",alignItems:"center",gap:"5px",padding:"6px 8px"},
                      onclick:(e)=>{ e.stopPropagation(); showCommentsModal(art.id, art.ownerUid, art.title, art.imageUrl); }
                    }, `💬 ${art.commentCount||0}`),
                    heartBtn
                  )
                )
              )
            );
          }))
    ));
    body.appendChild(h("div",{style:{padding:"0 20px 20px"}},
      h("button",{className:"btn btn-g",style:{width:"100%",justifyContent:"center"},onclick:close},t("closeLbl"))
    ));
  };
  loadAndRenderProfile();
  return wrap;
}

// ============================================================
// REPORT MODAL — flag a public artwork for moderation
// ============================================================
// NEW ROOT CAUSE FOUND: every render() call runs cleanupListeners() FIRST,
// which aborts ALL event listeners registered during the previous render
// and hands out a fresh AbortController for the new one (this is how the
// app avoids leaking listeners on every re-render). showReportModal() used
// to build its buttons with h() *before* calling S.emit() — so they were
// bound to the OLD (about-to-be-aborted) controller. The instant S.emit()
// ran, cleanupListeners() aborted that controller and silently stripped
// every listener the modal had *just* gotten, a split second after they
// were created. The modal still displayed (DOM nodes don't disappear on
// abort, only their listeners do) — which is exactly why it looked frozen:
// visible, but nothing wired to anything. Every other modal in this file
// (DeleteAccountModal, ResetPasswordModal, etc.) avoids this because
// render() constructs them *itself*, after cleanupListeners() has already
// handed out the fresh controller. Fixed the same way here: showReportModal()
// now only stores which artwork to report; ReportModal() below does the
// actual h()-based construction, and is called from inside render() —
// after the new controller is already active — exactly like every other
// modal.

}

    {id:'nsfw',       ar:'محتوى غير لائق بالبروفايل', tr:'Uygunsuz profil içeriği', en:'Inappropriate profile content'},
    {id:'impersonation', ar:'انتحال شخصية',          tr:'Kimlik taklidi',         en:'Impersonation'},
    {id:'other',      ar:'سبب آخر',                  tr:'Diğer',                  en:'Other'}

  let selectedReason = null;
  const close = () => {S.modal=null;S.emit();};
  const reasonBtns = [];
  const wrap = h("div",{className:"modal-bg",onclick:close},
    h("div",{className:"modal",style:{maxWidth:"420px"},onclick:e=>e.stopPropagation()},

      h("div",{style:{display:"flex",flexDirection:"column",gap:"6px",marginBottom:"16px"}},

          const btn = h("button",{
            className:"btn btn-g",

            onclick:() => {
              selectedReason = r.id;
              reasonBtns.forEach(b => { b.style.border = (b.dataset.reasonId===r.id) ? "1px solid var(--accent)" : "1px solid var(--border)"; });

      h("button",{className:"btn btn-p",style:{width:"100%",justifyContent:"center",marginBottom:"8px"},

          const result = await reportUser(uid, selectedReason);

          } else {
