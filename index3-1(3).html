/* Story ring — Instagram-style gradient border around an avatar that has
   at least one non-expired story. .story-ring--empty is the plain, dim
   fallback ring for accounts with no active story (still visible, so the
   circle doesn't look broken, just not "lit up"). The ring is a wrapper
   with padding, not a border on the avatar itself, so it never distorts
   the avatar's own size/shape. */
.story-ring{display:inline-flex;padding:3px;border-radius:50%;background:conic-gradient(from 45deg,#f59e0b,#db2777,#9333ea,#4f46e5,#f59e0b);cursor:pointer;transition:transform .15s}

.story-ring--empty{background:var(--border)}
.story-ring--seen{background:#6b7280}
.story-ring__inner{padding:2px;border-radius:50%;background:var(--bg2)}

.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
// FIX (root cause of repeated "firebase-load-timeout"): firebase-messaging.js
// used to be a static import right here, alongside app/auth/firestore.
// Static ES module imports are all-or-nothing — if THIS ONE file failed to
// load for any reason (slow connection, transient CDN hiccup, a privacy
// extension being more aggressive about anything named "messaging"/FCM),
// the browser refused to run ANY of this script, so auth and Firestore
// never initialized either — even on a connection that loaded them fine
// moments earlier when tested directly. Messaging (push notifications) is
// optional, so it's now loaded dynamically, after core Firebase is already
// marked ready, and its failure can never block sign-in or data again.

const firebaseConfig = {
  apiKey: "AIzaSyDdL9Nu3PMEXBPm_b744zEeoQo-M1CSGw8",
  authDomain: "sketch-journey-29416.firebaseapp.com",

const fbAuth = getAuth(fbApp);

// Without this, entries written while offline (or during a flaky connection)
// were never queued anywhere — the write promise could hang/fail and the
// entry would silently vanish the next time the realtime listener resynced
// from the server. persistentLocalCache stores writes in IndexedDB and
// syncs them automatically once the connection is back.

  fbDb = initializeFirestore(fbApp, {
    localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
  });

  // browser doesn't support IndexedDB — fall back to the plain in-memory client.

// ============================================================

// a public identifier; the matching SECRET key is configured in the
// Cloudflare Worker as env.APPCHECK_ENFORCED=true + token verification.

  en:[
    {icon:"🔺",level:"Beginner",title:"Basic Shapes & Construction",overview:"Every complex drawing starts as simple shapes — circles, cubes, cylinders. Learning to \"see\" shapes inside a subject is the foundation of accurate drawing. Professional artists still block in these basic forms even after years of practice, because it's the fastest way to catch proportion mistakes before they get buried under detail. Skipping this step is the single most common reason a drawing looks \"off\" without the artist knowing why.",points:["Break any subject down into basic geometric shapes before adding detail", "Use light construction lines you can erase later — press softly, you're not committing yet", "Circles become heads/eyes, cylinders become limbs/necks, cubes become torsos/boxes", "Compare the size of one shape against another before finalizing either one (e.g. is the head really half the height of the torso?)", "Rotate or tilt your basic shapes to suggest perspective before you worry about surface detail"],mistakes:["Jumping straight to outlines and details, skipping the shape stage entirely", "Pressing too hard on construction lines, making them impossible to erase cleanly later", "Building each shape in isolation instead of checking it against the shapes around it"],practice:"Pick any object near you — a mug, a shoe, a face in a photo — and sketch it using only 3–4 basic shapes, no details at all. Compare your shape sketch to the real object: are the proportions close? Only then go back and add detail on top."},
    {icon:"💡",level:"Beginner",title:"Understanding Light & Shadow",overview:"Shading gives a drawing depth and makes it look three-dimensional. Once you know where the light comes from, shadows follow logically — you're not guessing, you're applying a rule consistently across the whole piece. Most beginner shading looks patchy because the light direction keeps silently changing from one part of the drawing to another.",points:["Pick one light source direction first — everything else follows from it", "Core shadow (on the object itself) is darker than cast shadow (on the ground)", "Add a highlight where light hits directly, and reflected light on the shadow side", "Shadows get softer (less defined edges) the further they are from the object casting them", "Squint at your reference — squinting hides color and detail, leaving just the light/dark pattern"],mistakes:["Shading each object under a different imaginary light direction", "Making every shadow the same flat gray instead of varying its darkness", "Forgetting the cast shadow entirely, which is often what sells the illusion of weight and depth"],practice:"Draw a simple sphere and a cube next to each other, lit from the same upper-left light source. Shade both with core shadow, cast shadow, and one highlight each — then check that the cast shadows point the same direction."},
    {icon:"🎨",level:"Beginner",title:"Color Theory Basics",overview:"Colors interact with each other — knowing basic relationships helps you pick palettes that feel intentional instead of random. A piece with three colors chosen on purpose almost always reads better than one with ten colors chosen by instinct. This is less about memorizing rules and more about training your eye to notice why a color combination works or doesn't.",points:["Primary colors (red, blue, yellow) mix into everything else", "Complementary colors (opposite on the color wheel) create contrast and energy", "Analogous colors (next to each other) create harmony and calm", "Warm colors (red/orange/yellow) tend to advance toward the viewer; cool colors (blue/green/purple) tend to recede", "A limited palette (3–4 colors) almost always looks more cohesive than an unlimited one"],mistakes:["Using pure, fully-saturated color straight from the tube/palette everywhere, which flattens the piece", "Picking colors purely by \"what looks nice\" without checking their relationship on the color wheel", "Ignoring value (lightness/darkness) and relying on color alone to create contrast"],practice:"Pick 3 analogous colors (next to each other on the wheel) and use them to color a simple shape or sketch. Then try the same sketch again with a complementary pair instead — notice how differently the mood reads."},
    {icon:"📐",level:"Intermediate",title:"One-Point Perspective",overview:"Perspective makes a flat drawing feel like real 3D space. One-point perspective is the simplest version and a great starting point — it's what you see looking straight down a hallway, road, or train track. Once this clicks, two-point and three-point perspective are just extensions of the same core idea.",points:["Draw a horizon line and place one vanishing point on it", "All parallel lines going \"into\" the scene point toward that vanishing point", "Objects get smaller the closer they are to the vanishing point", "Anything above the horizon line shows its underside as it recedes; anything below shows its top", "Keep your vanishing point consistent for every object in the same scene — one scene, one vanishing point"],mistakes:["Letting perspective lines drift instead of pointing exactly at the vanishing point", "Placing the horizon line randomly instead of deciding the viewer's eye level first", "Mixing one-point perspective with objects that are actually angled (which need two-point instead)"],practice:"Draw a simple hallway or road using one vanishing point. Add doors or windows along the walls, making sure every one of their edges points back to that same vanishing point."},
    {icon:"🙂",level:"Intermediate",title:"Facial Proportions",overview:"Faces follow predictable proportions that make features look balanced, even before you add your own style. These aren't rigid rules — real faces vary — but they're an excellent starting scaffold, especially when a face looks \"almost right but something's off\" and you can't tell what. Most of the time the issue is spacing, not the shape of any single feature.",points:["Eyes sit roughly at the halfway point of the head, vertically — not near the top, like most beginners assume", "There's usually about one eye-width of space between the eyes", "The bottom of the nose sits about halfway between the eyebrows and the chin", "The mouth is usually about one-third of the way between the nose and chin", "Ears typically span from eyebrow level to the bottom of the nose"],mistakes:["Drawing the eyes too high on the head, which is the single most common face proportion mistake", "Making the head shape first, then squeezing features into it without measuring", "Copying the exact proportions of a reference photo without checking they follow the general guide first — small reference errors get amplified"],practice:"Sketch a simple oval face and mark these guide lines lightly before adding any features. Then draw the same face a second time from memory, using only the guide lines — compare the two."},
    {icon:"🖼",level:"Beginner–Intermediate",title:"Composition & Rule of Thirds",overview:"Where you place your subject changes how a piece feels, sometimes more than the drawing skill itself. The rule of thirds is a simple, reliable way to create balanced compositions without needing to think too hard about it — and once it feels natural, you'll start noticing when to break it on purpose.",points:["Divide your canvas into a 3×3 grid (two horizontal lines, two vertical lines)", "Place your main subject on a grid intersection, not dead center", "Leave breathing room in the direction your subject is facing or moving", "Use the horizontal grid lines to place horizons or key eye-level elements", "Dead-center compositions can work too — but only when that's a deliberate choice, not a default"],mistakes:["Centering the subject automatically without considering the alternative", "Cropping so tightly that the subject has no room to \"breathe\" in the direction it's facing", "Applying the rule of thirds mechanically without asking whether it actually serves this specific piece"],practice:"Look at one of your existing drawings and imagine a 3×3 grid over it — was your subject near an intersection? Pick a new subject and sketch two thumbnail versions: one centered, one on a grid intersection. Which one feels stronger?"},
    {icon:"🏃",level:"Beginner–Intermediate",title:"Gesture Drawing",overview:"Gesture drawing captures the energy, movement, and weight of a pose in seconds, before worrying about anatomy or detail. It's the difference between a figure that looks stiff and one that feels alive. Most working artists start every figure drawing session with a handful of 30–60 second gesture sketches, purely as a warm-up.",points:["Draw fast — set a timer for 30–60 seconds and don't lift your pencil more than necessary", "Look for the \"line of action\" — one flowing curve that captures the pose's main direction", "Ignore fingers, faces, and clothing folds entirely at this stage", "Exaggerate the pose slightly — a stiff, accurate gesture reads worse than a slightly exaggerated lively one", "Find where the weight sits — which leg or point is actually holding the body up"],mistakes:["Slowing down to add detail, which defeats the entire purpose of the exercise", "Drawing the outline of the body instead of its core gesture/movement", "Treating gesture drawing as \"throwaway practice\" instead of a skill that directly improves every other drawing"],practice:"Find 5 photos of people in action poses (sports, dancing, walking). Give yourself 45 seconds per pose and draw only the line of action and rough weight distribution — no details allowed."},
    {icon:"🌓",level:"Beginner",title:"Value Scale & Contrast",overview:"Value — how light or dark something is — matters more than color for making a drawing read clearly. A piece with strong values works even in black and white; a piece that relies on color alone often falls apart the moment you squint at it. This is why so many drawing fundamentals are taught in pencil before color ever gets introduced.",points:["Draw a value scale from 1 (white) to 9 or 10 (black) before shading anything else — it trains your eye to see gradations", "The biggest contrast (lightest light next to darkest dark) naturally draws the eye — use it deliberately on your focal point", "Most of a drawing should sit in the middle values; save the extremes for accents", "Turn a reference photo to grayscale (or squint at it) to see its value pattern clearly, separate from color", "Compare values by placing your pencil/tool next to the paper — is this shadow actually darker than that one, or does it just look that way?"],mistakes:["Using only 2–3 values total, which makes a drawing look flat no matter how much color is added", "Putting the strongest contrast somewhere that isn't the intended focal point, accidentally pulling the eye away", "Judging value in isolation instead of comparing it against the values right next to it"],practice:"Take any reference photo, convert it to grayscale, and try to identify just 5 distinct value zones (not 20). Shade a quick sketch using only those 5 values."},
    {icon:"✋",level:"Intermediate–Advanced",title:"Drawing Hands",overview:"Hands are famously difficult — even experienced artists sometimes dread drawing them — because they're incredibly flexible and every finger is doing something slightly different. The trick is to stop thinking of a hand as five separate fingers and start thinking of it as simple shapes that happen to have fingers attached.",points:["Start with the palm as one flattened box/shape, not with individual fingers", "Fingers are made of three simple cylinder segments each, not one smooth tapering shape", "The thumb sits on its own separate plane from the other four fingers — it doesn't move like they do", "Group fingers in twos or threes rather than drawing each one in full isolation", "Reference your own hand constantly — it's always available and shows real anatomy, not a stylized guess"],mistakes:["Drawing all fingers the same length, when in reality only the middle finger is the longest", "Treating the hand as flat/2D instead of a 3D form with the palm curving away from the viewer", "Avoiding hands entirely by hiding them behind the subject's back or out of frame"],practice:"Photograph your own hand in a relaxed, slightly curled pose. Block in the palm as one shape and each finger as three simple segments before adding any detail like knuckles or nails."},
    {icon:"✒️",level:"Intermediate",title:"Cross-Hatching & Shading Techniques",overview:"The mark-making technique you choose — not just where you put light and dark — shapes how a drawing feels. Cross-hatching, stippling, and blending each create a different texture and mood, and mixing them intentionally (rather than by accident) is what separates a controlled drawing from a messy one.",points:["Cross-hatching builds darkness by layering sets of parallel lines at different angles", "Follow the form with your hatching lines (curve them along a rounded surface) to reinforce its 3D shape", "Stippling (dots) creates a softer, grainier texture — useful for skin or worn surfaces", "Blending (with a tortillon, tissue, or finger) smooths tone but can also flatten texture if overused", "Vary your line spacing and pressure — evenly spaced identical lines read as mechanical, not natural"],mistakes:["Hatching in only one direction regardless of the surface's form, flattening the 3D illusion", "Blending everything smooth, which removes the texture cues that make a surface feel real", "Switching techniques randomly across one piece instead of choosing one approach per area on purpose"],practice:"Draw the same simple sphere three times, shading each one with a different technique: cross-hatching, stippling, and blending. Compare how different the mood and texture feel despite the identical shape and light source."}

    {icon:"💡",level:"مبتدئ",title:"فهم الضوء والظل",overview:"التظليل يمنح الرسمة عمقًا ويجعلها تبدو ثلاثية الأبعاد. بمجرد معرفة اتجاه الضوء، تتبعه الظلال بشكل منطقي — أنتِ لا تخمّنين، بل تطبّقين قاعدة ثابتة على كامل العمل. أغلب تظليل المبتدئين يبدو متقطعًا لأن اتجاه الضوء يتغير بصمت من جزء لآخر بالرسمة.",points:["حدّدي اتجاه مصدر ضوء واحد أولًا — كل شيء آخر يتبع منه", "الظل الأساسي (على الجسم نفسه) أغمق من الظل المسقط (على الأرض)", "أضيفي بريقًا ضوئيًا حيث يضرب الضوء مباشرة، وضوءًا منعكسًا في جهة الظل", "تصبح الظلال أكثر نعومة (حوافها أقل وضوحًا) كلما ابتعدت عن الجسم الذي يُسقطها", "ضيّقي عينيك وأنتِ تنظرين للمرجع — هذا يخفي اللون والتفاصيل ويُظهر فقط نمط الضوء والظل"],mistakes:["تظليل كل جسم بافتراض اتجاه ضوء مختلف وهمي", "جعل كل الظلال بنفس درجة الرمادي المسطحة بدل تنويع قتامتها", "نسيان الظل المسقط كليًا، وهو غالبًا ما يمنح إحساس الثقل والعمق"],practice:"ارسمي كرة بسيطة ومكعبًا بجانبها، مُضاءين من نفس مصدر الضوء العلوي الأيسر. ظلّلي كليهما بظل أساسي وظل مسقط وبريق ضوئي واحد لكل منهما — ثم تأكدي أن الظلال المسقطة تشير لنفس الاتجاه."},
    {icon:"🎨",level:"مبتدئ",title:"أساسيات نظرية الألوان",overview:"الألوان تتفاعل مع بعضها — معرفة العلاقات الأساسية تساعدك على اختيار تدرجات ألوان تبدو مقصودة لا عشوائية. عمل بثلاثة ألوان مختارة بعناية يبدو غالبًا أفضل من عمل بعشرة ألوان مختارة بالحدس. الأمر أقل ما يكون عن حفظ القواعد وأكثر ما يكون عن تدريب عينك على ملاحظة سبب نجاح أو فشل تركيبة ألوان معينة.",points:["الألوان الأساسية (أحمر، أزرق، أصفر) تمتزج لتكوّن كل الألوان الأخرى", "الألوان المتكاملة (المتقابلة على عجلة الألوان) تخلق تباينًا وحيوية", "الألوان المتجاورة (المتقاربة) تخلق انسجامًا وهدوءًا", "الألوان الدافئة (أحمر/برتقالي/أصفر) تميل للتقدم نحو المشاهد؛ الباردة (أزرق/أخضر/بنفسجي) تميل للتراجع", "لوحة ألوان محدودة (3-4 ألوان) تبدو غالبًا أكثر تماسكًا من لوحة غير محدودة"],mistakes:["استخدام اللون النقي المشبع بالكامل من الأنبوب/اللوحة بكل مكان، ما يُسطّح العمل", "اختيار الألوان بناءً على \"ما يبدو جميلاً\" فقط دون فحص علاقتها على عجلة الألوان", "تجاهل القيمة (الفاتح/الغامق) والاعتماد على اللون وحده لخلق التباين"],practice:"اختاري 3 ألوان متجاورة (متقاربة على العجلة) واستخدميها لتلوين شكل بسيط أو رسمة. ثم جربي نفس الرسمة مجددًا بزوج ألوان متكامل بدلاً منها — لاحظي كيف يختلف الإحساس العام."},
    {icon:"📐",level:"متوسط",title:"المنظور بنقطة تلاشٍ واحدة",overview:"المنظور يجعل الرسمة المسطحة تبدو كمساحة ثلاثية الأبعاد حقيقية. منظور النقطة الواحدة هو أبسط نسخة وبداية ممتازة — هو ما تراه وأنتِ تنظرين مباشرة في ممر، طريق، أو خط سكة قطار. بمجرد فهم هذا، يصبح منظور النقطتين والثلاث نقاط مجرد امتداد لنفس الفكرة الأساسية.",points:["ارسمي خط أفق وضعي نقطة تلاشٍ واحدة عليه", "كل الخطوط المتوازية التي تدخل عمق المشهد تتجه نحو تلك النقطة", "الأجسام تصغر كلما اقتربت من نقطة التلاشي", "أي شيء فوق خط الأفق يُظهر جانبه السفلي وهو يتراجع؛ وأي شيء تحته يُظهر جانبه العلوي", "حافظي على ثبات نقطة التلاشي لكل الأجسام بنفس المشهد — مشهد واحد، نقطة تلاشٍ واحدة"],mistakes:["ترك خطوط المنظور تنحرف بدل أن تشير بدقة لنقطة التلاشي", "وضع خط الأفق عشوائيًا بدل تحديد مستوى عين المشاهد أولًا", "خلط منظور النقطة الواحدة مع أجسام مائلة فعليًا (تحتاج منظور نقطتين بدلاً من ذلك)"],practice:"ارسمي ممرًا بسيطًا أو طريقًا باستخدام نقطة تلاشٍ واحدة. أضيفي أبوابًا أو نوافذ على طول الجدران، وتأكدي أن كل حافة منها تشير لنفس نقطة التلاشي."},
    {icon:"🙂",level:"متوسط",title:"تناسب ملامح الوجه",overview:"الوجوه تتبع نسبًا يمكن توقعها تجعل الملامح تبدو متوازنة، حتى قبل إضافة أسلوبك الشخصي. هذه ليست قواعد صارمة — الوجوه الحقيقية تتفاوت — لكنها هيكل انطلاق ممتاز، خصوصًا عندما يبدو الوجه \"شبه صحيح لكن فيه شي غلط\" ولا تعرفين شنو هو بالضبط. غالبًا المشكلة تكون بالمسافات، لا بشكل ملمح واحد.",points:["تقع العينان تقريبًا في منتصف الرأس عموديًا — وليس قرب الأعلى كما يفترض أغلب المبتدئين", "توجد عادة مسافة بعرض عين واحدة بين العينين", "تقع قاعدة الأنف تقريبًا في منتصف المسافة بين الحاجبين والذقن", "يقع الفم عادةً بحوالي ثلث المسافة بين الأنف والذقن", "تمتد الأذنان عادةً من مستوى الحاجب إلى قاعدة الأنف"],mistakes:["رسم العينين مرتفعتين جدًا على الرأس، وهو الخطأ الأكثر شيوعًا بنسب الوجه", "رسم شكل الرأس أولاً ثم حشر الملامح فيه دون قياس", "نسخ نسب صورة مرجعية بالضبط دون التأكد أولاً أنها تتبع الدليل العام — أخطاء المرجع الصغيرة تتضخم"],practice:"ارسمي وجهًا بيضاويًا بسيطًا وحدّدي خطوط الإرشاد هذه بخفة قبل إضافة أي ملامح. ثم ارسمي نفس الوجه مرة ثانية من الذاكرة، مستخدمةً خطوط الإرشاد فقط — قارني بين الاثنين."},
    {icon:"🖼",level:"مبتدئ–متوسط",title:"التكوين وقاعدة الأثلاث",overview:"مكان وضع موضوعك يغيّر إحساس اللوحة بالكامل، أحيانًا أكثر من مهارة الرسم نفسها. قاعدة الأثلاث طريقة بسيطة وموثوقة لخلق تكوين متوازن دون تفكير كثير — وبمجرد أن تصبح طبيعية بالنسبة لك، ستبدئين بملاحظة متى تكسرينها عن قصد.",points:["قسّمي لوحتك إلى شبكة 3×3 (خطان أفقيان، خطان عموديان)", "ضعي موضوعك الرئيسي على إحدى تقاطعات الشبكة، لا في منتصف اللوحة تمامًا", "اتركي مساحة تنفّس في الاتجاه الذي يواجهه موضوعك أو يتحرك نحوه", "استخدمي خطوط الشبكة الأفقية لوضع خط الأفق أو عناصر مستوى العين المهمة", "التكوين المركزي تمامًا يمكن أن ينجح أيضًا — لكن فقط حين يكون اختيارًا مقصودًا لا افتراضيًا"],mistakes:["توسيط الموضوع تلقائيًا دون التفكير بالبديل", "قص الصورة بشكل ضيق جدًا لدرجة أن الموضوع لا يجد مساحة \"يتنفس\" بها بالاتجاه الذي يواجهه", "تطبيق قاعدة الأثلاث ميكانيكيًا دون سؤال هل تخدم فعلًا هذا العمل بالتحديد"],practice:"انظري إلى إحدى رسماتك الحالية وتخيّلي شبكة 3×3 فوقها — هل كان موضوعك قريبًا من تقاطع؟ اختاري موضوعًا جديدًا وارسمي نسختين مصغّرتين: واحدة مركزية، وواحدة على تقاطع الشبكة. أيهما تبدو أقوى؟"},
    {icon:"🏃",level:"مبتدئ–متوسط",title:"رسم الإيماءة",overview:"رسم الإيماءة يلتقط طاقة وحركة وثقل الوضعية خلال ثوانٍ، قبل القلق بشأن التشريح أو التفاصيل. هو الفرق بين شخصية تبدو متيبسة وأخرى تبدو حيّة. أغلب الفنانين المحترفين يبدؤون كل جلسة رسم أشخاص بمجموعة رسمات إيماءة سريعة تستغرق 30-60 ثانية، كإحماء فقط.",points:["ارسمي بسرعة — اضبطي مؤقتًا لـ30-60 ثانية ولا ترفعي قلمك إلا عند الضرورة", "ابحثي عن \"خط الحركة\" — منحنى واحد سلس يلتقط الاتجاه الرئيسي للوضعية", "تجاهلي الأصابع والوجه وتجاعيد الملابس كليًا بهذه المرحلة", "بالغي قليلاً بالوضعية — إيماءة دقيقة لكن متيبسة تبدو أسوأ من إيماءة حيوية مبالغ بها قليلاً", "حددي أين يستقر الثقل — أي رجل أو نقطة تحمل الجسم فعليًا"],mistakes:["التباطؤ لإضافة تفاصيل، ما يُلغي الهدف الكامل من التمرين", "رسم الخط الخارجي للجسم بدل جوهر حركته/إيماءته", "التعامل مع رسم الإيماءة كـ\"تمرين يُرمى\" بدل مهارة تحسّن كل رسمة أخرى مباشرة"],practice:"ابحثي عن 5 صور لأشخاص بوضعيات حركية (رياضة، رقص، مشي). أعطي نفسك 45 ثانية لكل وضعية وارسمي فقط خط الحركة وتوزيع الثقل التقريبي — بدون أي تفاصيل مسموحة."},
    {icon:"🌓",level:"مبتدئ",title:"مقياس القيمة والتباين",overview:"القيمة — مدى فاتح أو غامق الشيء — أهم من اللون بجعل الرسمة واضحة. العمل بقيم قوية ينجح حتى بالأبيض والأسود؛ عمل يعتمد على اللون وحده غالبًا ينهار بمجرد أن تضيّقي عينيك له. لهذا تُدرّس أغلب أساسيات الرسم بالقلم الرصاص قبل إدخال اللون أصلاً.",points:["ارسمي مقياس قيمة من 1 (أبيض) إلى 9 أو 10 (أسود) قبل تظليل أي شيء آخر — يدرّب عينك على رؤية التدرجات", "أكبر تباين (أفتح فاتح بجانب أغمق غامق) يجذب العين طبيعيًا — استخدميه بقصد على نقطة التركيز", "أغلب الرسمة يجب أن تقع بالقيم المتوسطة؛ احفظي الأطراف القصوى للّمسات المميزة", "حوّلي صورة مرجعية للرمادي (أو ضيّقي عينيك لها) لرؤية نمط قيمتها واضحًا، منفصلاً عن اللون", "قارني القيم بوضع قلمكِ/أداتكِ بجانب الورقة — هل هذا الظل فعلاً أغمق من ذاك، أم يبدو كذلك فقط؟"],mistakes:["استخدام 2-3 قيم فقط بالمجموع، ما يجعل الرسمة تبدو مسطحة مهما أضفتِ لون", "وضع أقوى تباين بمكان ليس نقطة التركيز المقصودة، فتسحب العين بعيدًا عن غير قصد", "الحكم على القيمة بمعزل بدل مقارنتها بالقيم المجاورة لها مباشرة"],practice:"خذي أي صورة مرجعية، حوّليها للرمادي، وحاولي تحديد 5 مناطق قيمة مميزة فقط (لا 20). ظلّلي رسمة سريعة باستخدام هذه القيم الخمس فقط."},
    {icon:"✋",level:"متوسط–متقدم",title:"رسم الأيدي",overview:"الأيدي صعبة بشكل معروف — حتى الفنانون المتمرسون أحيانًا يخافون رسمها — لأنها مرنة جدًا وكل إصبع يفعل شيئًا مختلفًا قليلاً. الحل هو التوقف عن التفكير باليد كخمسة أصابع منفصلة والبدء بالتفكير بها كأشكال بسيطة يصادف أن لها أصابع متصلة بها.",points:["ابدئي بالكف كشكل/صندوق مسطح واحد، لا بأصابع منفردة", "الأصابع مكوّنة من ثلاثة أجزاء أسطوانية بسيطة لكل منها، لا شكل متدرج ناعم واحد", "الإبهام يقع بمستوى منفصل عن الأصابع الأربعة الأخرى — لا يتحرك مثلهم", "جمّعي الأصابع باثنين أو ثلاثة بدل رسم كل واحد بمعزل تام", "استخدمي يدك أنتِ كمرجع دائمًا — متوفرة دومًا وتُظهر تشريحًا حقيقيًا، لا تخمينًا مُنمّطًا"],mistakes:["رسم كل الأصابع بنفس الطول، بينما الواقع أن الإصبع الأوسط هو الأطول فقط", "التعامل مع اليد كشكل مسطح/ثنائي الأبعاد بدل شكل ثلاثي الأبعاد بكف ينحني بعيدًا عن المشاهد", "تجنّب رسم الأيدي كليًا بإخفائها خلف ظهر الموضوع أو خارج الإطار"],practice:"صوّري يدك بوضعية مسترخية ومقوّسة قليلاً. ابني الكف كشكل واحد وكل إصبع كثلاثة أجزاء بسيطة قبل إضافة أي تفاصيل كالمفاصل أو الأظافر."},
    {icon:"✒️",level:"متوسط",title:"تقنيات التظليل المتقاطع",overview:"تقنية وضع العلامات التي تختارينها — لا فقط مكان الضوء والظل — تشكّل إحساس الرسمة. التظليل المتقاطع، والتنقيط، والمزج كل منها يخلق نسيجًا ومزاجًا مختلفًا، ومزجها بقصد (لا بالصدفة) هو ما يفرّق بين رسمة متحكم بها وأخرى فوضوية.",points:["التظليل المتقاطع يبني القتامة بتكديس مجموعات من خطوط متوازية بزوايا مختلفة", "اتبعي شكل السطح بخطوط تظليلك (قوّسيها على سطح منحني) لتعزيز شكله ثلاثي الأبعاد", "التنقيط (نقاط) يخلق نسيجًا أنعم وأكثر حبيبية — مفيد للبشرة أو الأسطح المهترئة", "المزج (بأداة تمزيج، منديل، أو إصبع) يُنعّم الدرجة لكن قد يُسطّح النسيج إن أُفرط باستخدامه", "نوّعي المسافة بين خطوطك والضغط — خطوط متطابقة متساوية المسافة تبدو آلية لا طبيعية"],mistakes:["التظليل باتجاه واحد فقط بغض النظر عن شكل السطح، ما يُسطّح الوهم ثلاثي الأبعاد", "مزج كل شيء لينعم تمامًا، ما يُزيل إشارات النسيج التي تجعل السطح يبدو حقيقيًا", "تبديل التقنيات عشوائيًا بنفس العمل بدل اختيار أسلوب واحد لكل منطقة بقصد"],practice:"ارسمي نفس الكرة البسيطة ثلاث مرات، وظلّلي كل واحدة بتقنية مختلفة: تظليل متقاطع، تنقيط، ومزج. قارني كيف يختلف الإحساس والنسيج رغم تطابق الشكل ومصدر الضوء."}

  tr:[
    {icon:"🔺",level:"Başlangıç",title:"Temel Şekiller ve Yapı",overview:"Her karmaşık çizim basit şekillerle başlar — daireler, küpler, silindirler. Bir konunun içindeki şekilleri \"görmeyi\" öğrenmek, doğru çizimin temelidir. Profesyonel sanatçılar bile yıllarca pratikten sonra hâlâ bu temel formları önce bloklar, çünkü orantı hatalarını detaylar altında kaybolmadan yakalamanın en hızlı yoludur. Bu adımı atlamak, bir çizimin sanatçı nedenini bilmeden \"yanlış\" görünmesinin en yaygın sebebidir.",points:["Detay eklemeden önce herhangi bir konuyu basit geometrik şekillere ayırın", "Daha sonra silebileceğiniz hafif yapı çizgileri kullanın — hafif bastırın, henüz kesinleştirmediniz", "Daireler baş/göz olur, silindirler kol/boyun olur, küpler gövde/kutu olur", "Birini kesinleştirmeden önce bir şeklin boyutunu diğerine kıyaslayın (örneğin baş gerçekten gövdenin yarısı yüksekliğinde mi?)", "Yüzey detaylarını düşünmeden önce temel şekillerinizi perspektifi ima edecek şekilde döndürün veya eğin"],mistakes:["Şekil aşamasını tamamen atlayıp doğrudan dış hatlara ve detaylara geçmek", "Yapı çizgilerine çok sert basarak sonradan temiz silinmelerini imkânsız hale getirmek", "Her şekli çevresindeki şekillerle karşılaştırmadan izole şekilde oluşturmak"],practice:"Yakınınızdaki bir nesneyi seçin — bir kupa, ayakkabı, bir fotoğraftaki yüz — ve hiç detay eklemeden sadece 3-4 temel şekil kullanarak çizin. Şekil eskizinizi gerçek nesneyle karşılaştırın: oranlar yakın mı? Ancak o zaman geri dönüp üzerine detay ekleyin."},
    {icon:"💡",level:"Başlangıç",title:"Işık ve Gölgeyi Anlamak",overview:"Gölgelendirme çizime derinlik katar ve üç boyutlu görünmesini sağlar. Işığın nereden geldiğini bildiğinizde gölgeler mantıksal olarak takip eder — tahmin etmiyorsunuz, tüm eser boyunca tutarlı bir kural uyguluyorsunuz. Çoğu başlangıç seviyesi gölgelendirme lekeli görünür çünkü ışık yönü çizimin bir bölümünden diğerine sessizce değişir.",points:["Önce tek bir ışık kaynağı yönü belirleyin — geri kalan her şey ondan takip eder", "Ana gölge (nesnenin üzerinde) düşen gölgeden (zemindeki) daha koyudur", "Işığın doğrudan vurduğu yere bir vurgu, gölge tarafına yansıyan ışık ekleyin", "Gölgeler, onu oluşturan nesneden uzaklaştıkça yumuşar (kenarları daha az belirgin olur)", "Referansınıza gözlerinizi kısarak bakın — bu, rengi ve detayı gizleyip sadece ışık/gölge desenini bırakır"],mistakes:["Her nesneyi farklı hayali bir ışık yönü altında gölgelendirmek", "Her gölgeyi koyuluğunu değiştirmeden aynı düz gri yapmak", "Genellikle ağırlık ve derinlik yanılsamasını sağlayan düşen gölgeyi tamamen unutmak"],practice:"Aynı üst-sol ışık kaynağıyla aydınlatılmış basit bir küre ve yanına bir küp çizin. Her ikisini de ana gölge, düşen gölge ve birer vurgu ile gölgelendirin — sonra düşen gölgelerin aynı yönü gösterdiğini kontrol edin."},
    {icon:"🎨",level:"Başlangıç",title:"Renk Teorisi Temelleri",overview:"Renkler birbirleriyle etkileşime girer — temel ilişkileri bilmek, rastgele değil kasıtlı hissettiren paletler seçmenize yardımcı olur. Bilinçli seçilmiş üç renkli bir eser, içgüdüyle seçilmiş on renkli bir eserden neredeyse her zaman daha iyi okunur. Bu, kuralları ezberlemekten çok, gözünüzü bir renk kombinasyonunun neden işe yarayıp yaramadığını fark etmeye eğitmekle ilgilidir.",points:["Ana renkler (kırmızı, mavi, sarı) diğer her şeyi oluşturmak için karışır", "Tamamlayıcı renkler (renk çarkında zıt olanlar) kontrast ve enerji yaratır", "Analog renkler (yan yana olanlar) uyum ve sakinlik yaratır", "Sıcak renkler (kırmızı/turuncu/sarı) izleyiciye doğru öne çıkma eğilimindedir; soğuk renkler (mavi/yeşil/mor) geri çekilme eğilimindedir", "Sınırlı bir palet (3-4 renk) neredeyse her zaman sınırsız bir paletten daha tutarlı görünür"],mistakes:["Her yerde tüpten/paletten doğrudan saf, tam doygun renk kullanmak, bu eseri düzleştirir", "Renk çarkındaki ilişkilerini kontrol etmeden sadece \"güzel görünen\" renkleri seçmek", "Değeri (açıklık/koyuluk) görmezden gelip kontrast yaratmak için sadece renge güvenmek"],practice:"3 analog renk (çarkta yan yana) seçin ve basit bir şekli veya çizimi renklendirmek için kullanın. Sonra aynı eskizi tamamlayıcı bir çift renkle tekrar deneyin — ruh halinin ne kadar farklı okunduğunu fark edin."},
    {icon:"📐",level:"Orta Seviye",title:"Tek Nokta Perspektif",overview:"Perspektif, düz çizimlerin gerçek 3D alan gibi hissettirmesini sağlar. Tek nokta perspektif en basit versiyondur ve harika bir başlangıç noktasıdır — bir koridora, yola veya tren rayına dümdüz baktığınızda gördüğünüz şeydir. Bu anlaşıldıktan sonra, iki nokta ve üç nokta perspektif aynı temel fikrin sadece uzantılarıdır.",points:["Bir ufuk çizgisi çizin ve üzerine tek bir kaçış noktası yerleştirin", "Sahnenin içine giren tüm paralel çizgiler o kaçış noktasına doğru işaret eder", "Nesneler kaçış noktasına yaklaştıkça küçülür", "Ufuk çizgisinin üzerindeki her şey uzaklaştıkça alt yüzünü gösterir; altındaki her şey üst yüzünü gösterir", "Aynı sahnedeki her nesne için kaçış noktanızı tutarlı tutun — bir sahne, bir kaçış noktası"],mistakes:["Perspektif çizgilerinin tam olarak kaçış noktasına işaret etmek yerine kaymasına izin vermek", "Önce izleyicinin göz seviyesine karar vermeden ufuk çizgisini rastgele yerleştirmek", "Tek nokta perspektifi gerçekte açılı olan (bunun yerine iki nokta gerektiren) nesnelerle karıştırmak"],practice:"Tek bir kaçış noktası kullanarak basit bir koridor veya yol çizin. Duvarlar boyunca kapılar veya pencereler ekleyin, her kenarının aynı kaçış noktasına işaret ettiğinden emin olun."},
    {icon:"🙂",level:"Orta Seviye",title:"Yüz Oranları",overview:"Yüzler, kendi tarzınızı eklemeden önce bile özelliklerin dengeli görünmesini sağlayan öngörülebilir oranları takip eder. Bunlar katı kurallar değil — gerçek yüzler değişir — ama özellikle bir yüz \"neredeyse doğru ama bir şeyler yanlış\" göründüğünde ve nedenini anlayamadığınızda mükemmel bir başlangıç iskeledir. Çoğu zaman sorun herhangi bir özelliğin şeklinde değil, aralıklardadır.",points:["Gözler dikey olarak kafanın yaklaşık yarısında yer alır — çoğu başlangıç seviyesinin varsaydığı gibi tepeye yakın değil", "Genellikle gözler arasında bir göz genişliği kadar boşluk vardır", "Burnun altı, kaşlar ile çene arasındaki mesafenin yaklaşık yarısında yer alır", "Ağız genellikle burun ile çene arasındaki mesafenin yaklaşık üçte birinde yer alır", "Kulaklar tipik olarak kaş seviyesinden burnun altına kadar uzanır"],mistakes:["Gözleri kafada çok yükseğe çizmek, bu en yaygın yüz oranı hatasıdır", "Önce kafa şeklini yapıp sonra ölçüm yapmadan özellikleri içine sıkıştırmak", "Önce genel kılavuzu takip edip etmediğini kontrol etmeden bir referans fotoğrafın tam oranlarını kopyalamak — küçük referans hataları büyütülür"],practice:"Basit oval bir yüz çizin ve özellikleri eklemeden önce bu kılavuz çizgileri hafifçe işaretleyin. Sonra aynı yüzü sadece kılavuz çizgileri kullanarak hafızadan ikinci kez çizin — ikisini karşılaştırın."},
    {icon:"🖼",level:"Başlangıç–Orta",title:"Kompozisyon ve Üçte Bir Kuralı",overview:"Konunuzu nereye yerleştirdiğiniz, bazen çizim becerisinin kendisinden bile daha çok, bir eserin hissini değiştirir. Üçte bir kuralı, çok fazla düşünmeden dengeli kompozisyonlar oluşturmanın basit ve güvenilir bir yoludur — ve doğal hissettirmeye başladığında, ne zaman kasıtlı olarak kırılacağını fark etmeye başlarsınız.",points:["Tuvalinizi 3×3'lük bir ızgaraya bölün (iki yatay çizgi, iki dikey çizgi)", "Ana konunuzu tam ortaya değil, ızgara kesişim noktalarından birine yerleştirin", "Konunuzun baktığı veya hareket ettiği yönde nefes alma boşluğu bırakın", "Ufukları veya önemli göz seviyesi öğelerini yerleştirmek için yatay ızgara çizgilerini kullanın", "Tam merkezli kompozisyonlar da işe yarayabilir — ama sadece varsayılan değil, bilinçli bir seçim olduğunda"],mistakes:["Alternatifi düşünmeden konuyu otomatik olarak ortalamak", "Konunun baktığı yönde \"nefes\" alacak yeri kalmayacak kadar sıkı kırpmak", "Bu belirli esere gerçekten hizmet edip etmediğini sormadan üçte bir kuralını mekanik olarak uygulamak"],practice:"Mevcut çizimlerinizden birini alın ve üzerine 3×3'lük bir ızgara hayal edin — konunuz bir kesişime yakın mıydı? Yeni bir konu seçin ve iki küçük taslak çizin: biri ortalanmış, biri ızgara kesişiminde. Hangisi daha güçlü hissettiriyor?"},
    {icon:"🏃",level:"Başlangıç–Orta",title:"Jest Çizimi",overview:"Jest çizimi, anatomi veya detay konusunda endişelenmeden önce, saniyeler içinde bir pozun enerjisini, hareketini ve ağırlığını yakalar. Katı görünen bir figür ile canlı hissettiren bir figür arasındaki farktır. Çoğu profesyonel sanatçı her figür çizim seansına, tamamen ısınma olarak, 30-60 saniyelik birkaç jest eskiziyle başlar.",points:["Hızlı çizin — 30-60 saniyelik bir zamanlayıcı kurun ve kaleminizi gerekenden fazla kaldırmayın", "\"Hareket çizgisini\" arayın — pozun ana yönünü yakalayan tek bir akıcı eğri", "Bu aşamada parmakları, yüzü ve kıyafet kıvrımlarını tamamen görmezden gelin", "Pozu hafifçe abartın — sıkı ama doğru bir jest, hafifçe abartılmış canlı bir jestten daha kötü okunur", "Ağırlığın nerede oturduğunu bulun — hangi bacak veya nokta gerçekten vücudu taşıyor"],mistakes:["Detay eklemek için yavaşlamak, bu tüm egzersizin amacını boşa çıkarır", "Vücudun dış hattını, temel jestini/hareketini değil, çizmek", "Jest çizimini doğrudan diğer her çizimi geliştiren bir beceri yerine \"atılabilir pratik\" olarak görmek"],practice:"Aksiyon pozlarındaki (spor, dans, yürüme) 5 fotoğraf bulun. Her poz için kendinize 45 saniye verin ve sadece hareket çizgisini ve kaba ağırlık dağılımını çizin — hiçbir detaya izin verilmez."},
    {icon:"🌓",level:"Başlangıç",title:"Değer Skalası ve Kontrast",overview:"Değer — bir şeyin ne kadar açık veya koyu olduğu — bir çizimin net okunmasını sağlamada renkten daha önemlidir. Güçlü değerlere sahip bir eser siyah beyazda bile işe yarar; sadece renge güvenen bir eser genellikle gözlerinizi kıstığınız anda dağılır. Bu yüzden birçok çizim temeli, renk hiç devreye girmeden önce kalemle öğretilir.",points:["Başka bir şeyi gölgelendirmeden önce 1'den (beyaz) 9 veya 10'a (siyah) bir değer skalası çizin — bu gözünüzü tonlamaları görmeye eğitir", "En büyük kontrast (en açık açıkla en koyu koyu yan yana) gözü doğal olarak çeker — bunu odak noktanızda bilinçli olarak kullanın", "Bir çizimin çoğu orta değerlerde olmalıdır; uçları vurgular için saklayın", "Rengi bir kenara bırakıp değer desenini net görmek için bir referans fotoğrafını gri tonlamaya çevirin (veya ona gözlerinizi kısarak bakın)", "Değerleri kaleminizi/aracınızı kâğıdın yanına koyarak karşılaştırın — bu gölge gerçekten şundan daha mı koyu, yoksa sadece öyle mi görünüyor?"],mistakes:["Toplamda sadece 2-3 değer kullanmak, ne kadar renk eklenirse eklensin çizimin düz görünmesine neden olur", "En güçlü kontrastı amaçlanan odak noktası olmayan bir yere koyarak gözü yanlışlıkla oradan uzaklaştırmak", "Değeri, hemen yanındaki değerlerle karşılaştırmak yerine izole bir şekilde yargılamak"],practice:"Herhangi bir referans fotoğrafı alın, gri tonlamaya çevirin ve sadece 5 farklı değer bölgesi (20 değil) belirlemeye çalışın. Sadece bu 5 değeri kullanarak hızlı bir eskiz gölgelendirin."},
    {icon:"✋",level:"Orta–İleri",title:"El Çizimi",overview:"Eller ünlü derecede zordur — deneyimli sanatçılar bile bazen onları çizmekten çekinir — çünkü inanılmaz derecede esnektirler ve her parmak biraz farklı bir şey yapar. Hile, eli beş ayrı parmak olarak düşünmeyi bırakıp, tesadüfen parmakları olan basit şekiller olarak düşünmeye başlamaktır.",points:["Bireysel parmaklarla değil, avucu tek bir düzleştirilmiş kutu/şekil olarak başlatın", "Parmaklar her biri tek bir pürüzsüz daralan şekil değil, üç basit silindir segmentinden oluşur", "Başparmak diğer dört parmaktan ayrı kendi düzleminde oturur — onlar gibi hareket etmez", "Parmakları tamamen izole çizmek yerine ikişerli veya üçerli gruplayın", "Sürekli kendi elinizi referans alın — her zaman mevcuttur ve stilize bir tahmin değil, gerçek anatomiyi gösterir"],mistakes:["Gerçekte sadece orta parmak en uzun olduğu halde tüm parmakları aynı uzunlukta çizmek", "Eli düz/2D bir form olarak ele almak, avucun izleyiciden uzağa kıvrıldığı 3D bir form yerine", "Elleri konunun arkasına gizleyerek veya kadraj dışında bırakarak tamamen çizimden kaçınmak"],practice:"Kendi elinizi rahat, hafifçe kıvrılmış bir pozda fotoğraflayın. Eklem veya tırnak gibi herhangi bir detay eklemeden önce avucu tek bir şekil, her parmağı üç basit segment olarak bloklayın."},
    {icon:"✒️",level:"Orta",title:"Tarama ve Gölgelendirme Teknikleri",overview:"Seçtiğiniz işaretleme tekniği — sadece ışık ve gölgeyi nereye koyduğunuz değil — bir çizimin nasıl hissettirdiğini şekillendirir. Çapraz tarama, noktalama ve harmanlama her biri farklı bir doku ve ruh hali yaratır; bunları kazara değil bilinçli olarak karıştırmak, kontrollü bir çizimi dağınık olandan ayıran şeydir.",points:["Çapraz tarama, farklı açılarda paralel çizgi setlerini katmanlayarak koyuluk oluşturur", "Tarama çizgilerinizle formu takip edin (yuvarlak bir yüzey boyunca kıvırın) 3D şeklini güçlendirmek için", "Noktalama (noktalar) daha yumuşak, daha taneli bir doku yaratır — cilt veya eskimiş yüzeyler için kullanışlıdır", "Harmanlama (bir tortillon, mendil veya parmakla) tonu düzleştirir ama aşırı kullanılırsa dokuyu da düzleştirebilir", "Çizgi aralığınızı ve baskınızı değiştirin — eşit aralıklı özdeş çizgiler doğal değil mekanik hissettirir"],mistakes:["Yüzeyin formundan bağımsız olarak sadece tek bir yönde tarama yapmak, 3D yanılsamasını düzleştirir", "Her şeyi pürüzsüz harmanlamak, bir yüzeyi gerçek hissettiren doku ipuçlarını ortadan kaldırır", "Bir eser boyunca teknikleri bilinçli olarak her alan için bir yaklaşım seçmek yerine rastgele değiştirmek"],practice:"Aynı basit küreyi üç kez çizin, her birini farklı bir teknikle gölgelendirin: çapraz tarama, noktalama ve harmanlama. Aynı şekil ve ışık kaynağına rağmen ruh hali ve dokunun ne kadar farklı hissettirdiğini karşılaştırın."}
  ]
};

// Auto-detect language from device on first visit
// (saved preference takes priority so manual changes stick)
function getInitialLang() {
  try {
    const saved = localStorage.getItem('sj_lang');
    if (saved && ['en','ar','tr'].includes(saved)) return saved;
  } catch(e) {}
  const navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if (navLang.startsWith('ar')) return 'ar';
  if (navLang.startsWith('tr')) return 'tr';
  return 'en';
}

function timeAgo(dateStr){
  if(!dateStr||dateStr==='Just now')return _lang==='ar'?'الآن':_lang==='tr'?'Şimdi':'Just now';
  try{
    const diff=Date.now()-new Date(dateStr).getTime();
    const mins=Math.floor(diff/60000);
    if(mins<1)return _lang==='ar'?'الآن':_lang==='tr'?'Şimdi':'Just now';
    if(mins<60){
      if(_lang==='ar')return `منذ ${mins} دقيقة`;
      if(_lang==='tr')return `${mins}dk önce`;
      return `${mins}m ago`;
    }
    const hours=Math.floor(mins/60);
    if(hours<24){
      if(_lang==='ar')return `منذ ${hours} ساعة`;
      if(_lang==='tr')return `${hours}sa önce`;
      return `${hours}h ago`;
    }
    const days=Math.floor(hours/24);
    if(days<7){
      if(_lang==='ar')return `منذ ${days} يوم`;
      if(_lang==='tr')return `${days}g önce`;
      return `${days}d ago`;
    }
    const weeks=Math.floor(days/7);
    if(_lang==='ar')return `منذ ${weeks} أسبوع`;
    if(_lang==='tr')return `${weeks}h önce`;
    return `${weeks}w ago`;
  }catch(e){return dateStr;}
}

// ============================================================
// AUTOMATIC ERROR MONITORING — free, uses the existing Firebase
// project (no new service/signup). Catches unexpected JS errors and
// unhandled promise rejections from real users' devices and logs them
// to a Firestore collection, so problems surface without needing a
// user to notice, screenshot, and report them manually.
//
// IMPORTANT — you still need to add Firestore security rules for the
// new 'error_logs' collection yourself (this file can't do that):
//   match /error_logs/{logId} {
//     allow create: if true;   // anyone can report an error, even signed out
//     allow read, update, delete: if false;  // nobody can read/tamper via the client
//   }
// Without a rule allowing `create`, every single error log attempt will
// itself fail silently (caught below) and nothing will be recorded.
// ============================================================
let _errorLogCount = 0;
const MAX_ERRORS_LOGGED_PER_SESSION = 10; // hard cap — a broken loop shouldn't flood Firestore
async function logErrorToCloud(info){
  if(_errorLogCount >= MAX_ERRORS_LOGGED_PER_SESSION) return;
  _errorLogCount++;
  try{
    const f = fb();
    if(!f || !f.db) return; // Firebase not ready yet — skip silently, never block the app
    const logId = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    await f.setDoc(f.doc(f.db,'error_logs',logId), {
      message: String(info.message||'').slice(0,500),
      stack: String(info.stack||'').slice(0,1500),
      page: (typeof S!=='undefined' && S?.page) || 'unknown',
      userId: (typeof S!=='undefined' && S?.user?.uid) || null,
      lang: (typeof _lang!=='undefined' && _lang) || 'unknown',
      userAgent: navigator.userAgent.slice(0,300),
      url: location.href.slice(0,300),
      createdAt: f.serverTimestamp ? f.serverTimestamp() : new Date().toISOString()
    });
  }catch(e){
    // Error logging must never itself cause more errors — fail silently.
  }
}
window.addEventListener('error', (event) => {
  logErrorToCloud({ message: event.message, stack: event.error?.stack });
});
window.addEventListener('unhandledrejection', (event) => {
  logErrorToCloud({
    message: 'Unhandled promise rejection: ' + (event.reason?.message || event.reason),
    stack: event.reason?.stack
  });
});
// ============================================================
// AUTH RATE LIMITING  (client-side defense in depth)
// ============================================================
// Firebase has its own IP-based throttling for auth, but it's
// generous and won't help against a single-user brute force from
// many IPs (botnet). This adds a per-device lockout that's harder
// to bypass without clearing localStorage.
//
// Counter resets after `LOCKOUT_WINDOW_MS` of no failed attempts,
// so a legitimate user who just mistypes twice won't get locked out.

const LOGIN_MAX_FAILS = 5;            // 5 failed attempts...
const LOGIN_LOCKOUT_MS = 15*60*1000;  // ...locks the form for 15 minutes
const RESET_COOLDOWN_MS = 60*1000;    // password reset: 1 email/minute max

function _rlGet(key, fallback){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function _rlSet(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function getLoginLockoutRemaining(email){
  const key = 'sj_login_lock_' + (email||'').toLowerCase();
  const rec = _rlGet(key, null);
  if(!rec) return 0;
  if(Date.now() - rec.firstAt > LOGIN_LOCKOUT_MS){
    // Expired — clear and allow
    localStorage.removeItem(key);
    return 0;
  }
  if(rec.fails >= LOGIN_MAX_FAILS){
    return Math.max(0, rec.lockedUntil - Date.now());
  }
  return 0;
}
function recordLoginFailure(email){
  const key = 'sj_login_lock_' + (email||'').toLowerCase();
  const rec = _rlGet(key, {fails:0, firstAt:Date.now(), lockedUntil:0});
  rec.fails = (rec.fails||0) + 1;
  if(rec.fails >= LOGIN_MAX_FAILS){
    rec.lockedUntil = Date.now() + LOGIN_LOCKOUT_MS;
  }
  _rlSet(key, rec);
  return rec;
}
function clearLoginFailures(email){
  const key = 'sj_login_lock_' + (email||'').toLowerCase();
  localStorage.removeItem(key);
}

function getResetCooldownRemaining(email){
  const key = 'sj_reset_cd_' + (email||'').toLowerCase();
  const lastSent = parseInt(localStorage.getItem(key) || '0', 10);
  return Math.max(0, RESET_COOLDOWN_MS - (Date.now() - lastSent));
}
function recordResetSent(email){
  const key = 'sj_reset_cd_' + (email||'').toLowerCase();
  localStorage.setItem(key, String(Date.now()));
}

// Lockout-aware wrappers. Throwing an Error with a friendly
// message means the UI can show "⏳ Try again in 12 minutes" instead
// of letting the request through to Firebase.

async function fbAuthSignUp(email,pass){
  // Signup lockout uses the email as the key so a single
  // account can't be hammered with new signups.
  const lock = getLoginLockoutRemaining(email);
  if(lock > 0){
    const mins = Math.ceil(lock/60000);
    throw new Error(_lang==='ar'?'محظور مؤقتاً. حاول بعد '+mins+' دقيقة':_lang==='tr'?'Geçici olarak engellendi. '+mins+' dakika sonra tekrar deneyin':'Temporarily locked. Try again in '+mins+' minutes');
  }
  await waitForFirebase();
  const f=fb();
  try{
    const cred = await f.createUserWithEmailAndPassword(f.auth,email,pass);
    clearLoginFailures(email);
    return cred;
  }catch(e){
    recordLoginFailure(email);
    throw e;
  }
}
async function fbAuthSignIn(email,pass){
  const lock = getLoginLockoutRemaining(email);
  if(lock > 0){
    const mins = Math.ceil(lock/60000);
    throw new Error(_lang==='ar'?'محظور مؤقتاً بسبب محاولات فاشلة. حاول بعد '+mins+' دقيقة':_lang==='tr'?'Başarısız denemeler nedeniyle geçici olarak engellendi. '+mins+' dakika sonra tekrar deneyin':'Temporarily locked due to failed attempts. Try again in '+mins+' minutes');
  }
  await waitForFirebase();
  const f=fb();
  try{
    const cred = await f.signInWithEmailAndPassword(f.auth,email,pass);
    clearLoginFailures(email);
    return cred;
  }catch(e){
    recordLoginFailure(email);
    throw e;
  }
}

// NOTE: this used to branch to signInWithRedirect() on mobile devices.
// That flow is unreliable on mobile browsers — a full page navigation away
// and back, which can silently fail to complete (private browsing modes,
// partitioned storage, etc.) leaving the user right back on the sign-in
// page with no error at all. signInWithPopup works fine on modern mobile
// browsers for a user-gesture-triggered click and never loses app state,
// so we now use it universally.
async function fbAuthGoogle(){
  await waitForFirebase();
  const f=fb();
  try{
    const cred=await f.signInWithPopup(f.auth,f.googleProvider);
    const snap=await f.getDoc(f.doc(f.db,'users',cred.user.uid));
    if(!snap.exists()){
      await createUserProfile(cred.user,cred.user.displayName||"Artist","Beginner");
      trackEvent('signup', { method: 'google' });
    } else {
      trackEvent('signin', { method: 'google' });
    }
    return cred;
  }catch(e){
    // Only fall back to redirect for a genuinely blocked/unsupported popup
    // — any other error (wrong config, network, user closed it) should
    // surface normally rather than silently trying a second flow.
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){

      await f.signInWithRedirect(f.auth,f.googleProvider);

    throw e;
  }

async function fbAuthReset(email){
  // Per-email cooldown prevents an attacker from spamming the
  // victim's mailbox with password-reset emails.
  const cooldown = getResetCooldownRemaining(email);
  if(cooldown > 0){
    const secs = Math.ceil(cooldown/1000);
    throw new Error(_lang==='ar'?'انتظر '+secs+' ثانية قبل المحاولة':_lang==='tr'?secs+' saniye bekleyin':'Wait '+secs+' seconds before trying again');

  await waitForFirebase();
  const f=fb();
  try{
    const result = await f.sendPasswordResetEmail(f.auth,email);
    recordResetSent(email);
    return result;
  }catch(e){
    // Don't update the cooldown timer on failure (e.g. user not
    // found) — that would just slow the legitimate user from
    // discovering a typo in their email.
    throw e;
  }
}

// ============================================================
// DELETE ACCOUNT  (GDPR-compliant full purge)
// ============================================================
// Wipes everything the user owns across the entire system, then
// deletes the auth account. The reauth step is required by Firebase
// for security-sensitive operations like user.delete().
//
// What we delete:
//   - users/{uid}                          (private profile)
//   - users/{uid}/entries/* and IDB images (private artworks)
//   - users_public/{uid}                   (public profile)
//   - users_public/{uid}/followers/*       (others' follow docs on us)
//   - users_public/{uid}/following/*       (our follow docs on others)
//   - artworks_public/* where ownerUid=uid (public artworks)
//   - reports/* where reporterUid=uid      (their reports)
//   - fcmTokens/{uid}                      (push subscription)
// Then: firebase.auth().currentUser.delete()
async function deleteUserAccount(){
  const f = fb();
  const user = f.auth.currentUser;
  if(!user) throw new Error('not-authenticated');
  const uid = user.uid;
  // Collect artwork IDs first so we can clean up likes+reports
  const myArtworks = await f.getDocs(f.query(
    f.collection(f.db,'artworks_public'),
    f.where('ownerUid','==',uid)
  ));
  const artworkIds = myArtworks.docs.map(d => d.id);
  // Delete public artworks AND their sub-collections
  for(const artId of artworkIds){
    try{
      const likesSnap = await f.getDocs(f.collection(f.db,'artworks_public',artId,'likes'));
      const reportsSnap = await f.getDocs(f.collection(f.db,'artworks_public',artId,'reports'));
      for(const d of [...likesSnap.docs, ...reportsSnap.docs]){
        try{ await f.deleteDoc(d.ref); }catch(e){}
      }
      await f.deleteDoc(f.doc(f.db,'artworks_public',artId));
    }catch(e){ console.warn('artwork delete failed:', artId, e); }
  }
  // Delete private entries (and their IDB images)
  const entriesSnap = await f.getDocs(f.collection(f.db,'users',uid,'entries'));
  for(const d of entriesSnap.docs){
    try{ await deleteImageFromIDB(d.id); }catch(e){} // legacy single-image key
    // NEW: multi-image entries store one IDB key per image index
    const imgCount = d.data()?.images?.length || 0;
    for(let i=0;i<imgCount;i++){
      try{ await deleteImageFromIDB(`${d.id}_${i}`); }catch(e){}
    }
    try{ await f.deleteDoc(d.ref); }catch(e){}
  }
  // Delete the private user doc
  try{ await f.deleteDoc(f.doc(f.db,'users',uid)); }catch(e){}
  // Delete public profile + its follow sub-collections
  for(const sub of ['followers','following']){
    try{
      const subSnap = await f.getDocs(f.collection(f.db,'users_public',uid,sub));
      for(const d of subSnap.docs){
        try{ await f.deleteDoc(d.ref); }catch(e){}
      }
    }catch(e){}
  }
  try{ await f.deleteDoc(f.doc(f.db,'users_public',uid)); }catch(e){}
  // Delete user's reports
  try{
    const reportsSnap = await f.getDocs(f.query(
      f.collection(f.db,'reports'),
      f.where('reporterUid','==',uid)
    ));
    for(const d of reportsSnap.docs){
      try{ await f.deleteDoc(d.ref); }catch(e){}
    }
  }catch(e){}
  // Delete FCM token
  try{ await f.deleteDoc(f.doc(f.db,'fcmTokens',uid)); }catch(e){}
  // Clean up IDB
  try{ await deleteImageFromIDB(uid); }catch(e){}
  // Finally delete the auth account itself
  await user.delete();
  // Wipe Service Worker caches + localStorage
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    try{ navigator.serviceWorker.controller.postMessage({type:'CLEAR_CACHES'}); }catch(e){}
  }
  try{ localStorage.clear(); }catch(e){}
}

async function createUserProfile(fbUser,name,skill){

  };
  await f.setDoc(f.doc(f.db,'users',fbUser.uid),profile);
  // No public profile yet — created lazily when user enables isPublic
  return profile;
}
async function loadUserProfile(uid){
  const f=fb();
  const snap=await f.getDoc(f.doc(f.db,'users',uid));
  return snap.exists()?snap.data():null;
}
async function saveUserProfile(uid,data){
  const f=fb();
  await f.setDoc(f.doc(f.db,'users',uid),data,{merge:true});
  // Keep the public profile in sync with privacy-relevant fields
  // (displayName, avatar, bio, skill, isPublic). Counters are updated
  // separately by syncPublicStats() to avoid stale snapshots.
  if('isPublic' in data || 'name' in data || 'avatar' in data || 'bio' in data || 'skill' in data){
    syncPublicProfile(uid, S.user, S.entries).catch(err => console.warn('public profile sync failed:', err));
  }
}

// ============================================================
// PUBLIC COMMUNITY — make social features real
// ============================================================
// Three collections back the community feature:
//
//   users_public/{uid}            — public profile (one doc per user)
//   users_public/{uid}/followers  — one doc per follower (presence = follow)
//   users_public/{uid}/following  — one doc per followed user
//   artworks_public/{artworkId}   — public artworks (opt-in per artwork)
//
// isPublic on the user's private profile controls whether their public
// profile exists at all. Each artwork also has its own isPublic flag —
// so a public user can still keep specific entries private.

// Cache of follower/following counts to avoid hitting Firestore for
// every render. Keyed by uid. Refreshed on demand by refreshMyCounts().
const _countCache = { followers: {}, following: {}, publicArtworks: {} };

async function syncPublicProfile(uid, user, entries){
  if(!uid || !user) return;
  const f=fb();
  if(!user.isPublic){
    // Opted out — remove the public doc so they disappear from Discover.
    try{
      await f.deleteDoc(f.doc(f.db,'users_public',uid));
    }catch(e){ /* doc may not exist; that's fine */ }
    return;
  }
  const publicArtworks = (entries||[]).filter(e => e.isPublic);
  await f.setDoc(f.doc(f.db,'users_public',uid),{
    uid,
    displayName: user.name || '',
    displayNameLower: (user.name || '').toLowerCase(),
    avatar: user.avatar || null,
    bio: user.bio || '',
    skill: user.skill || 'Beginner',
    joinedAt: user.joinedAt || new Date().toISOString(),
    artworkCount: publicArtworks.length,
    totalMins: (entries||[]).reduce((s,e)=>s+(e.timeSpent||0),0),
    isPublic: true,
    updatedAt: new Date().toISOString()
  }, { merge: true });
  // Also keep cached counts fresh for the current user
  _countCache.publicArtworks[uid] = publicArtworks.length;
  if(uid === S.user?.uid){
    S.myPublicArtworkCount = publicArtworks.length;
  }
}

async function refreshMyCounts(){
  if(!S.user?.uid) return;
  const f=fb();
  const myUid = S.user.uid;
  try{
    // FIX (root cause of Profile page "flicker"): S.emit() below used to
    // fire unconditionally every time this resolved (every 15s, per the
    // throttle above). Since ProfilePage() rebuilds its whole DOM tree —
    // including a .fade-in wrapper whose animation replays on every fresh
    // element — an emit with no real change still caused a visible flash
    // every 15s. Capture the prior values up front so we can only emit
    // when a count actually changed.
    const prevFollowing = S.user.following;
    const prevFollowers = S.user.followers;
    // Following = count of docs in my "following" subcollection
    const followingSnap = await f.getDocs(f.collection(f.db,'users_public',myUid,'following'));
    _countCache.following[myUid] = followingSnap.size;
    S.user.following = followingSnap.size;
    // Followers = count of docs in my "followers" subcollection
    const followersSnap = await f.getDocs(f.collection(f.db,'users_public',myUid,'followers'));
    _countCache.followers[myUid] = followersSnap.size;
    S.user.followers = followersSnap.size;
    const changed = prevFollowers !== followersSnap.size || prevFollowing !== followingSnap.size;
    if(changed) S.emit();
  }catch(e){
    console.warn('refreshMyCounts failed:', e);
  }
}

async function followUser(targetUid){
  if(!S.user?.uid || !targetUid || S.user.uid === targetUid) return false;
  const f=fb();
  const myUid = S.user.uid;
  try{
    // FIX (root cause of "can't follow anyone when my profile is
    // private"): this used to hard-block the entire follow action with
    // a "your profile is private" toast unless S.user.isPublic was true.
    // That's conflating two unrelated things — whether MY profile is
    // public only controls whether OTHER people can find/see ME; it has
    // nothing to do with my ability to follow someone else. The follow
    // relationship itself is written under the TARGET's own public
    // followers list (users_public/{targetUid}/followers/{myUid}), which
    // never actually depended on my own public profile existing. Only
    // sync my public profile if I have one enabled — never block the
    // follow itself on it.
    if(S.user.isPublic){
      await syncPublicProfile(myUid, S.user, S.entries);
    }
    // Atomic: write both sides in a transaction so a partial failure
    // can't leave us "following" someone who isn't following us back.
    await f.runTransaction(f.db, async (tx) => {
      const myFollowingRef   = f.doc(f.db,'users_public',myUid,'following',targetUid);
      const theirFollowerRef = f.doc(f.db,'users_public',targetUid,'followers',myUid);
      tx.set(myFollowingRef,   { timestamp: new Date().toISOString() });
      tx.set(theirFollowerRef, { timestamp: new Date().toISOString() });
    });
    // Optimistic local update
    _countCache.following[myUid] = (_countCache.following[myUid] || 0) + 1;
    S._followingSet = S._followingSet || new Set();
    S._followingSet.add(targetUid);
    S.user.following = (_countCache.following[myUid]);
    // NEW: actually notify the person being followed. This is a separate
    // write (not part of the transaction above) so a failure here — e.g.
    // a rules mismatch — never blocks or rolls back the follow itself,
    // which is the important part. See subscribeToCloudNotifications()
    // for how the target picks this up in their Notifications page.
    try{
      await f.setDoc(f.doc(f.db,'users',targetUid,'notifications', `follow_${myUid}`),{
        type: 'follow',
        fromUid: myUid,
        fromName: S.user.name || 'Someone',
        fromAvatar: S.user.avatar || null,
        read: false,
        time: new Date().toISOString()
      });
      sendPushNotification(
        targetUid,
        _lang==='ar'?'متابع جديد':_lang==='tr'?'Yeni takipçi':'New follower',
        `${S.user.name||'Someone'} ${_lang==='ar'?'بدأ يتابعك':_lang==='tr'?'seni takip etmeye başladı':'started following you'}`
      );
    }catch(e){ console.warn('follow notification failed:', e); }
    return true;
  }catch(e){
    console.error('followUser failed:', e);
    return false;
  }
}

async function unfollowUser(targetUid){
  if(!S.user?.uid || !targetUid) return false;
  const f=fb();
  const myUid = S.user.uid;
  try{
    await f.runTransaction(f.db, async (tx) => {
      const myFollowingRef   = f.doc(f.db,'users_public',myUid,'following',targetUid);
      const theirFollowerRef = f.doc(f.db,'users_public',targetUid,'followers',myUid);
      tx.delete(myFollowingRef);
      tx.delete(theirFollowerRef);
    });
    _countCache.following[myUid] = Math.max(0, (_countCache.following[myUid] || 0) - 1);
    S._followingSet = S._followingSet || new Set();
    S._followingSet.delete(targetUid);
    S.user.following = (_countCache.following[myUid]);
    return true;
  }catch(e){
    console.error('unfollowUser failed:', e);
    return false;
  }
}

// Hydrate the set of UIDs the current user follows, so the UI can show
// Follow / Following without a round-trip per profile card.
async function refreshFollowingSet(){
  if(!S.user?.uid) return;
  const f=fb();
  try{
    const snap = await f.getDocs(f.collection(f.db,'users_public',S.user.uid,'following'));
    S._followingSet = new Set(snap.docs.map(d => d.id));
  }catch(e){
    S._followingSet = S._followingSet || new Set();
  }
}

// ============================================================
// BLOCKING — lets someone stop an annoying account from following them,
// showing up in their Discover/Activity feeds, or interacting with their
// profile. This is enforced client-side (hiding/filtering + severing the
// follow relationship both directions) — it can't, on its own, stop a
// determined person from calling the API directly, since that needs a
// matching Firestore security rule too. Still worth having: it covers
// the app's normal UI entirely, which is what actually matters day to day.
// ============================================================
async function blockUser(targetUid, targetDisplayName){
  if(!S.user?.uid || !targetUid || S.user.uid === targetUid) return false;
  const f = fb();
  const myUid = S.user.uid;
  try{
    await f.setDoc(f.doc(f.db,'users',myUid,'blocked',targetUid),{
      blockedUid: targetUid,
      // NEW: snapshot the name at block time. Their public profile doc
      // (users_public/{uid}) gets deleted if they ever flip to private,
      // which would otherwise leave the Blocked Accounts list showing
      // nothing but a bare uid — this keeps it readable regardless.
      blockedName: targetDisplayName || '',
      blockedAt: new Date().toISOString()
    });
    // Sever any existing follow relationship in both directions — blocking
    // someone should also stop them following you, and stop you following
    // them, not just hide them going forward.
    try{
      await f.deleteDoc(f.doc(f.db,'users_public',myUid,'following',targetUid));
      await f.deleteDoc(f.doc(f.db,'users_public',targetUid,'followers',myUid));
      await f.deleteDoc(f.doc(f.db,'users_public',targetUid,'following',myUid));
      await f.deleteDoc(f.doc(f.db,'users_public',myUid,'followers',targetUid));
    }catch(e){ console.warn('block: follow cleanup failed (non-fatal):', e); }
    S._blockedSet = S._blockedSet || new Set();
    S._blockedSet.add(targetUid);
    S._followingSet?.delete(targetUid);
    return true;
  }catch(e){
    console.error('blockUser failed:', e);
    return false;
  }
}
async function unblockUser(targetUid){
  if(!S.user?.uid || !targetUid) return false;
  const f = fb();
  try{
    await f.deleteDoc(f.doc(f.db,'users',S.user.uid,'blocked',targetUid));
    S._blockedSet?.delete(targetUid);
    S._blockedDocs = (S._blockedDocs||[]).filter(d => d.uid !== targetUid);
    return true;
  }catch(e){
    console.error('unblockUser failed:', e);
    return false;
  }
}
async function refreshBlockedSet(){
  if(!S.user?.uid) return;
  const f = fb();
  try{
    const snap = await f.getDocs(f.collection(f.db,'users',S.user.uid,'blocked'));
    S._blockedSet = new Set(snap.docs.map(d => d.id));
    // NEW: keep the full docs too (uid, name, blockedAt) so the Blocked
    // Accounts list in Profile settings doesn't need a second round-trip.
    S._blockedDocs = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  }catch(e){
    S._blockedSet = S._blockedSet || new Set();
    S._blockedDocs = S._blockedDocs || [];
  }
}
function isUserBlocked(uid){
  return !!(S._blockedSet && S._blockedSet.has(uid));
}

// ============================================================
// STORIES — Instagram-style: post a photo, it shows as a gradient ring
// around the avatar, expires after 24h, and the owner can see a view count.
//
//   stories/{storyId}                      — one doc per story
//     ownerUid, ownerName, ownerAvatar, imageUrl, createdAt, expiresAt,
//     viewCount, posterDeviceId
//   stories/{storyId}/views/{deviceId}     — presence = "this device viewed it"
//                                             (also de-dupes the view counter)
//
// users_public/{uid}.lastStoryAt is kept in sync on every post so any
// screen showing a list of avatars (Discover, Following, Profile) can
// decide whether to light up the ring WITHOUT an extra query per card —
// it's already sitting on the profile doc they loaded anyway.
//
// NOTE on the view counter: this whole app requires signing in before any
// page (including a story) can even be opened — there's no route that
// bypasses AuthPage — so a literal "view from someone with zero account"
// isn't possible here. What "views without an account" means in practice
// is de-duping by DEVICE instead of by Firebase Auth account, via a random
// id persisted in localStorage (getDeviceViewerId() below). That's what
// lets opening your own story from a second browser/phone count as a
// view even while signed into the same account on both — at the cost of
// being approximate: clearing site data or using another browser resets
// the id, so the same real person CAN get counted more than once.
//
// IMPORTANT — like error_logs above, you need to add Firestore security
// rules for these two collections yourself (this file can't do that):
//   match /stories/{storyId} {
//     allow read: if true;
//     allow create: if request.auth != null
//       && request.resource.data.ownerUid == request.auth.uid;
//     allow delete: if request.auth != null
//       && request.auth.uid == resource.data.ownerUid;
//     allow update: if request.auth != null
//       && request.auth.uid != resource.data.ownerUid
//       && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['viewCount'])
//       && request.resource.data.viewCount == resource.data.viewCount + 1;
//     match /views/{deviceId} {
//       allow read: if request.auth != null
//         && request.auth.uid == get(/databases/$(database)/documents/stories/$(storyId)).data.ownerUid;
//       allow create: if request.auth != null; // keyed by device id, not uid — any signed-in visitor may record one
//       allow update, delete: if false;
//     }
//   }
// Without these, postStory()/recordStoryView() fail silently (permission-
// denied, caught below) and posting a story will show "could not post story".
// ============================================================
const STORY_TTL_MS = 24*60*60*1000;

function hasActiveStory(lastStoryAt){
  return !!(lastStoryAt && (Date.now() - new Date(lastStoryAt).getTime()) < STORY_TTL_MS);
}

// A random id for THIS browser/device, persisted in localStorage so it
// survives reloads. Used to de-dupe story views independently of which
// Firebase account is signed in — see the NOTE above. Falls back to a
// session-only id (not persisted) if localStorage is unavailable, e.g.
// private browsing — views still count for that one session at least.
function getDeviceViewerId(){
  try{
    let id = localStorage.getItem('sj_device_id');
    if(!id){
      id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
      localStorage.setItem('sj_device_id', id);
    }
    return id;
  }catch(e){
    if(!window.__sjSessionDeviceId){
      window.__sjSessionDeviceId = 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
    }
    return window.__sjSessionDeviceId;
  }
}

// --- "Seen" tracking, local to this device (localStorage), Instagram-style ---
// We track, per story-owner, the createdAt of the newest story THIS DEVICE
// has watched through. That's enough to (a) decide whether a ring should
// be the bright gradient (something new) or muted gray (already caught
// up), and (b) jump straight to the first unseen story when the viewer is
// reopened, instead of always restarting from story #1.
function getSeenUsersMap(){
  try{
    const raw = localStorage.getItem('sj_seen_story_users');
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function markUserStoriesSeenUpTo(ownerUid, createdAt){
  try{
    const map = getSeenUsersMap();
    if(!map[ownerUid] || new Date(createdAt) > new Date(map[ownerUid])){
      map[ownerUid] = createdAt;
      localStorage.setItem('sj_seen_story_users', JSON.stringify(map));
    }
  }catch(e){}
}
// 'none' = no active story at all, 'unseen' = has a story this device
// hasn't caught up to yet (bright ring), 'seen' = caught up (muted ring).
function storyRingState(lastStoryAt, ownerUid){
  if(!hasActiveStory(lastStoryAt)) return 'none';
  const seenAt = getSeenUsersMap()[ownerUid];
  if(seenAt && new Date(seenAt) >= new Date(lastStoryAt)) return 'seen';
  return 'unseen';
}

async function postStory(imageBase64){
  // Caller is expected to check S.user.isPublic first and toast a
  // specific message — a story is only ever meaningful on a public
  // profile (nobody could see it otherwise), so we just refuse quietly
  // here rather than duplicating that messaging in two places.
  if(!S.user?.uid || !S.user.isPublic) return false;
  const f=fb();
  const myUid=S.user.uid;
  const now=new Date();
  const expiresAt=new Date(now.getTime()+STORY_TTL_MS).toISOString();
  try{
    const ref=f.doc(f.collection(f.db,'stories'));
    await f.setDoc(ref,{
      ownerUid: myUid,
      ownerName: S.user.name||'',
      ownerAvatar: S.user.avatar||null,
      imageUrl: imageBase64,
      createdAt: now.toISOString(),
      expiresAt,
      viewCount: 0,
      posterDeviceId: getDeviceViewerId() // lets recordStoryView skip counting THIS device re-opening it
    });
    // Mirror lastStoryAt onto BOTH the public profile (so Discover/Following
    // cards can light up the ring without an extra query) and the private
    // users/{uid} doc (so it survives a reload — S.user is hydrated from
    // the private doc, not users_public, on every sign-in).
    await f.setDoc(f.doc(f.db,'users_public',myUid),{ lastStoryAt: now.toISOString() },{merge:true});
    await f.setDoc(f.doc(f.db,'users',myUid),{ lastStoryAt: now.toISOString() },{merge:true});
    S.user.lastStoryAt = now.toISOString();
    if(_countCache.profile?.[myUid]) _countCache.profile[myUid].lastStoryAt = now.toISOString();
    trackEvent('story_posted', {});
    return true;
  }catch(e){
    console.error('postStory failed:', e);
    return false;
  }
}

// All non-expired stories for one user, oldest first (so the viewer plays
// them in the order they were posted, like Instagram).
async function loadUserStories(uid){
  if(!uid) return [];
  const f=fb();
  try{
    const q = f.query(f.collection(f.db,'stories'), f.where('ownerUid','==',uid));
    const snap = await f.getDocs(q);
    const now = Date.now();
    return snap.docs
      .map(d => ({ id:d.id, ...d.data() }))
      .filter(s => new Date(s.expiresAt).getTime() > now)
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
  }catch(e){
    console.error('loadUserStories failed:', e);
    return [];
  }
}

// Records that THIS DEVICE viewed this story, once per device, and bumps
// the owner-visible view count. De-dupes by device id (see NOTE above),
// not by Firebase account — so it skips counting only when this is the
// exact device that originally posted the story, not merely "the same
// account signed in somewhere else".
async function recordStoryView(storyId, ownerUid, posterDeviceId){
  if(!storyId) return;
  const myDeviceId = getDeviceViewerId();
  if(posterDeviceId && myDeviceId === posterDeviceId) return; // this device is the one that posted it
  const f=fb();
  try{
    const viewRef = f.doc(f.db,'stories',storyId,'views',myDeviceId);
    const existing = await f.getDoc(viewRef);
    if(existing.exists()) return; // already counted from this device
    await f.runTransaction(f.db, async (tx) => {
      const storyRef = f.doc(f.db,'stories',storyId);
      const storySnap = await tx.get(storyRef);
      if(!storySnap.exists()) return;
      tx.set(viewRef, {
        viewerDeviceId: myDeviceId,
        viewerUid: S.user?.uid || null,
        viewerName: S.user?.name || 'Guest',
        viewedAt: new Date().toISOString()
      });
      tx.update(storyRef, { viewCount: (storySnap.data().viewCount||0) + 1 });
    });
  }catch(e){
    console.warn('recordStoryView failed:', e);
  }
}

// Shared by the Profile page and any avatar with a story ring (Discover /
// Following cards) — fetches that user's active stories and opens the
// full-screen viewer, starting at the first one this device hasn't
// caught up to yet (or from the top again if everything's been seen —
// same as tapping a muted/"seen" ring on Instagram).
async function openStoryViewer(uid){
  const stories = await loadUserStories(uid);
  if(!stories.length){
    S.showToast('📷 '+(_lang==='ar'?'ما فيه ستوري حالياً':_lang==='tr'?'Aktif hikaye yok':'No active story right now'),'');
    return;
  }
  const seenAt = getSeenUsersMap()[uid];
  let startIndex = 0;
  if(seenAt){
    const firstUnseen = stories.findIndex(s => new Date(s.createdAt) > new Date(seenAt));
    startIndex = firstUnseen === -1 ? 0 : firstUnseen;
  }
  S.modal = {type:'storyViewer', uid, stories, index:startIndex};
  S.emit();
}

async function deleteStory(storyId){
  if(!storyId) return false;
  const f=fb();
  try{
    await f.deleteDoc(f.doc(f.db,'stories',storyId));
    return true;
  }catch(e){
    console.error('deleteStory failed:', e);
    return false;
  }
}

// Get one user's public profile + cached counts (returns null if private)
async function getPublicProfile(uid){
  if(!uid) return null;
  const f=fb();
  // First check the local cache
  if(_countCache.profile?.[uid]) return _countCache.profile[uid];
  try{
    const snap = await f.getDoc(f.doc(f.db,'users_public',uid));
    if(!snap.exists()) return null;
    const data = snap.data();
    _countCache.profile = _countCache.profile || {};
    _countCache.profile[uid] = data;
    return data;
  }catch(e){
    return null;
  }
}

// Discover: list public users, excluding self, sorted by followers desc
async function loadDiscoverArtists(maxResults = 30){
  const f=fb();
  try{
    const q = f.query(
      f.collection(f.db,'users_public'),
      f.orderBy('updatedAt','desc'),
      f.limit(maxResults * 2) // overfetch so we can filter self out
    );
    const snap = await f.getDocs(q);
    const results = [];
    for(const docSnap of snap.docs){
      if(docSnap.id === S.user?.uid) continue;
      if(isUserBlocked(docSnap.id)) continue; // NEW: hide blocked accounts from Discover
      const data = docSnap.data();
      results.push({ uid: docSnap.id, ...data });
      if(results.length >= maxResults) break;
    }
    return results;
  }catch(e){
    console.error('loadDiscoverArtists failed:', e);
    return [];
  }
}

// Search public artists by name (prefix match on displayNameLower).

// Activity feed: latest public artworks from people I follow (or from
// everyone if I'm not following anyone yet, so the feed isn't empty)
async function loadActivityFeed(maxResults = 20){
  if(!S.user?.uid) return [];
  const f=fb();
  try{
    const followingSnap = await f.getDocs(
      f.collection(f.db,'users_public',S.user.uid,'following')
    );
    const followedUids = followingSnap.docs.map(d => d.id).filter(uid => !isUserBlocked(uid));
    // Firestore 'in' queries are limited to 30 — that's fine here.
    const ownerUids = followedUids.slice(0, 30);
    if(ownerUids.length === 0) return [];
    // Same composite-index trap as loadUserPublicArtworks: where('in',...)
    // + orderBy on a different field needs a composite index that doesn't
    // exist. Drop the orderBy, sort client-side instead.
    const q = f.query(
      f.collection(f.db,'artworks_public'),
      f.where('ownerUid','in',ownerUids),
      f.limit(maxResults * 2)
    );
    const snap = await f.getDocs(q);
    // FIX: the auto-hide-after-3-reports flag (isHidden) was being SET
    // correctly but never actually CHECKED anywhere — reported content
    // kept showing up in every feed regardless. Filter it out client-side
    // here (cheap since results are already capped at `maxResults`, and
    // avoids needing a new Firestore composite index for a server-side filter).
    return snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(a => !a.isHidden && !isUserBlocked(a.ownerUid))
      .sort((a,b) => String(b.createdAt||'').localeCompare(String(a.createdAt||'')))
      .slice(0, maxResults);
  }catch(e){
    console.warn('loadActivityFeed failed (probably index missing):', e.message);
    return [];
  }
}
